<!doctype html>
<!--
  dom 95 Arcade — a small cabinet that plays classic games from the places that host them.
  Nothing here is copied from the games: each one loads in its host's official player
  (Miniplay embed, itch.io embed, Internet Archive emulation, RetroGames.cc embed) or
  opens on the host's site. Games marked byo can also boot a copy you own in ../dos/play.html.
  Usage: arcade.html?g=<id>   (ids are the keys of GAMES below)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcade</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px Tahoma, "MS Sans Serif", sans-serif; color: #c0c0c0; user-select: none; }
    #stage { position: absolute; inset: 0 0 22px 0; }
    #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
    #title { position: absolute; inset: 0 0 22px 0; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; overflow: auto;
      background: radial-gradient(ellipse at 50% 40%, var(--glow, #123) 0%, #000 70%); }
    #title::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
    #title[hidden] { display: none; }
    .card { position: relative; z-index: 1; max-width: 520px; }
    .marquee { font: bold clamp(22px, 6vw, 40px)/1.05 "Arial Black", Impact, sans-serif; letter-spacing: 1px; color: var(--ink, #ffd800); text-shadow: 3px 3px 0 var(--shade, #b02000), 0 0 18px var(--glow2, rgba(255,216,0,.35)); text-transform: uppercase; }
    .sub { margin: 6px 0 14px; font: italic bold 14px Georgia, serif; color: #8fd8ff; }
    .blurb { color: #ddd; font-size: 13px; line-height: 1.45; margin: 0 auto 16px; max-width: 460px; }
    .meta { color: #8a8a8a; font-size: 11px; margin-top: 14px; }
    .meta a { color: #8fd8ff; }
    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn { min-width: 120px; min-height: 26px; padding: 4px 14px; border: 0; background: #c0c0c0; color: #000; font: inherit; cursor: pointer;
      box-shadow: inset -1px -1px #000, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; }
    .btn:active { box-shadow: inset -1px -1px #fff, inset 1px 1px #000, inset -2px -2px #dfdfdf, inset 2px 2px #808080; padding: 5px 13px 3px 15px; }
    .btn.go { font-weight: bold; outline: 1px solid #000; }
    .coin { display: inline-block; margin-bottom: 10px; color: #ff4040; font: bold 12px "Courier New", monospace; letter-spacing: 2px; animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; display: flex; align-items: center; gap: 12px; padding: 0 8px; background: #c0c0c0; color: #000; white-space: nowrap; overflow: hidden; }
    #bar a { color: #000080; }
    #bar .r { margin-left: auto; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="title"><div class="card">
    <div class="coin">INSERT COIN</div>
    <div class="marquee" id="name"></div>
    <div class="sub" id="sub"></div>
    <p class="blurb" id="blurb"></p>
    <div class="btns" id="btns"></div>
    <div class="meta" id="meta"></div>
  </div></div>
  <div id="bar"><span id="keys"></span><span class="r" id="credit"></span></div>
  <script>
    "use strict";
    // host: who runs the game; embed: their official embeddable player (omit when the host can't be framed)
    // native: the player's fixed screen size, so the frame can be scaled to fit the window
    const IA = id => ({ embed: "https://archive.org/embed/" + id, page: "https://archive.org/details/" + id, host: "the Internet Archive", hostUrl: "https://archive.org/details/" + id, native: [640, 480] });
    const PC = path => "https://playclassic.games/games/" + path + "/play/";
    // byo: the game can also boot from your own copy in this site's DOSBox (../dos/play.html)
    const GAMES = {
      ontherun: {
        name: "On the Run", sub: "Officine Pixel for Miniclip · Shockwave", look: ["#ff6a00", "#5a1600", "#3a1200"],
        blurb: "Take the wheel and make your getaway: the cops are on your tail, so reach the next checkpoint before time runs out. Miniclip's web games went dark and the original won't run anywhere any more, so I built a tribute you can still play.",
        keys: "Getaway: ↑ gas · ↓ brake · ←/→ steer · M sound · P pause",
        embed: "getaway.html", playLabel: "▶ Play Getaway (tribute)", host: "this site", hostUrl: "getaway.html",
        page: "https://www.youtube.com/watch?v=vokULrYJQSg", altLabel: "Watch the original",
        more: [["Flash Gaming Wiki", "https://flashgaming.fandom.com/wiki/On_The_Run"]], credit: "Getaway is original code & art"
      },
      robotrage: {
        name: "Robot Rage", sub: "remade by KonsomeJona", look: ["#3ad0ff", "#00305a", "#06223a"],
        blurb: "Customize a robot, drive it into the arena, and knock everyone else out. A modern online remake of the old game, with real opponents.",
        keys: "WASD / arrows drive · mouse aims and fires · it's online multiplayer",
        embed: "https://itch.io/embed-upload/19770901?color=000000", page: "https://konsomejona.itch.io/robot-rage", host: "itch.io", hostUrl: "https://konsomejona.itch.io/robot-rage",
        credit: "by KonsomeJona"
      },
      victorvector: {
        name: "Victor Vector & Yondo", sub: "The Cyberplasm Formula · Sanctuary Woods, 1993", look: ["#9cff3a", "#1d4a00", "#0e2a00"],
        blurb: "A comic-book adventure on CD-ROM: Victor Vector and his dog Yondo, and a whole lot of clicking on things to see what they do.",
        keys: "Runs in a Windows 3.1 machine in the cloud · free sign-in required",
        page: "https://yag.im/games/1148/the-awesome-adventures-of-victor-vector-and-yondo-the-cyberplasm-formula", host: "yag.im", hostUrl: "https://yag.im/",
        why: "yag.im streams the game from a real emulated PC and needs you to sign in, so it opens in its own window."
      },
      arkanoid: Object.assign(IA("arkanoid_1988"), {
        name: "Arkanoid", sub: "Taito · arcade 1986 · this is the 1988 DOS port", look: ["#ff3ad0", "#4a0040", "#2a0026"],
        blurb: "Steer the Vaus, bounce the energy ball, break every brick and grab the capsules. Thirty-two rounds stand between you and DOH.",
        keys: "Click the power button to boot DOS · mouse or arrows move · button/space fires",
        more: [["Play the original arcade version", "https://pexy.io/game/arkanoid-arcade/"]]
      }),
      arena: Object.assign(IA("ARENA_201902"), {
        name: "The Elder Scrolls: Arena", sub: "Bethesda Softworks, 1994", look: ["#ffcf6a", "#4a2a00", "#2a1800"],
        blurb: "Where Tamriel started. Escape the Imperial dungeon and go hunting for the eight pieces of the Staff of Chaos, across the whole continent.",
        keys: "Click the power button to boot DOS · mouse drives everything · right-drag to swing",
        more: [["Free on Steam", "https://store.steampowered.com/app/1812290/"], ["Also on PlayClassic", "https://playclassic.games/games/role-playing-dos-games-online/play-the-elder-scrolls-arena-online/play/"]]
      }),
      daggerfall: Object.assign(IA("msdos_The_Elder_Scrolls_-_Daggerfall_1996"), {
        name: "The Elder Scrolls II: Daggerfall", sub: "Bethesda Softworks, 1996", look: ["#d0d0ff", "#20204a", "#10102a"],
        blurb: "A map the size of Great Britain, dungeons you can actually get lost in for good, and a missing letter the Emperor wants back. Give DOS a minute to load it.",
        keys: "Click the power button to boot DOS (large download) · WASD/arrows move · mouse looks",
        more: [["Free on Steam", "https://store.steampowered.com/app/1812390/"], ["Daggerfall Unity", "https://www.dfworkshop.net/"], ["Also on DOS Zone", "https://dos.zone/daggerfall/"]]
      }),
      kq1: Object.assign(IA("msdos_Kings_Quest_I_-_Quest_for_the_Crown_1987"), {
        name: "King's Quest", sub: "Quest for the Crown · Sierra On-Line, 1984 · this is the 1987 DOS release", look: ["#ffd84a", "#2a3ab0", "#101a4a"], byo: true,
        blurb: "Sir Graham, the kingdom of Daventry, and three lost treasures: the magic mirror, the shield and the chest. Type what you want to do and hope the parser agrees.",
        keys: "Click the power button to boot DOS · arrows walk · type commands (LOOK, GET DAGGER) and press Enter",
        more: [["King's Quest 1+2+3 on GOG", "https://www.gog.com/en/game/kings_quest_1_2_3"], ["Also on PlayClassic", PC("adventure-dos-games-online/play-kings-quest-quest-crown-online")]]
      }),
      settlers2: Object.assign(IA("msdos_Settlers_II_The_Gold_Edition_1997"), {
        name: "The Settlers II", sub: "Gold Edition · Blue Byte, 1996", look: ["#7ad84a", "#5a3a10", "#1a3010"], byo: true,
        blurb: "Build roads, keep the goods flowing and watch hundreds of little settlers get on with it. Shipwrecked Romans, a new continent, and an economy that runs on planks and fish.",
        keys: "Click the power button to boot DOS (large download) · mouse drives everything",
        more: [["Gold Edition on GOG", "https://www.gog.com/en/game/the_settlers_2_gold_edition"], ["Also on PlayClassic", PC("real-time-strategy-dos-games-online/play-settlers-2-gold-edition-online")]]
      }),
      dott: Object.assign(IA("msdos_Day_of_the_Tentacle_1993"), {
        name: "Day of the Tentacle", sub: "Maniac Mansion II · LucasArts, 1993", look: ["#c06aff", "#2a8a20", "#200a3a"], byo: true,
        blurb: "Purple Tentacle drank the sludge and wants to take over the world. Bernard, Hoagie and Laverne get sent through time in Chron-O-Johns to stop him: one in the past, one in the present, one in the future.",
        keys: "Click the power button to boot DOS (large download) · pick a verb, then a thing · Esc skips cutscenes",
        more: [["Remastered on GOG", "https://www.gog.com/en/game/day_of_the_tentacle_remastered"], ["Also on PlayClassic", PC("point-n-click-adventure-dos-games-online/play-maniac-mansion-day-tentacle-online")]]
      }),
      yoda: {
        name: "Star Wars: Yoda Stories", sub: "LucasArts, 1997 · Game Boy Color, 1999", look: ["#7aff6a", "#103a10", "#0a200a"],
        blurb: "Luke goes to Dagobah and Yoda keeps sending him on errands: every game is a freshly generated little adventure. This is the Game Boy Color version.",
        keys: "Arrows move · Z / X are A / B · Enter is Start",
        embed: "https://www.retrogames.cc/embed/27549-yoda-stories-usa.html", page: "https://www.retrogames.cc/gameboycolor-games/yoda-stories-usa.html",
        host: "RetroGames.cc", hostUrl: "https://www.retrogames.cc/gameboycolor-games/yoda-stories-usa.html",
        why: "RetroGames.cc shows an ad before the game: close it with its ✕ (never its Download button), then press PLAY NOW."
      },
      fable: Object.assign(IA("msdos_Fable_1996"), {
        name: "Fable", sub: "Simbiosis Interactive, 1996", look: ["#ffb04a", "#3a1a5a", "#1a0a2a"], byo: true,
        blurb: "Quickthorpe sets out to find the four pieces of a broken stone and save a world sliding into chaos. A painted, hand-drawn point-and-click from 1996 (long before the other Fable).",
        keys: "Click the power button to boot DOS (large download) · point and click",
        more: [["Also on PlayClassic", PC("point-n-click-adventure-dos-games-online/play-fable-online")]]
      }),
      lemmings: Object.assign(IA("LEMMING"), {
        name: "Lemmings", sub: "DMA Design / Psygnosis, 1991", look: ["#4aff4a", "#2a2ab0", "#0a1a3a"], byo: true,
        blurb: "They walk. They don't stop. Give them jobs (climber, floater, bomber, blocker, builder, basher, miner, digger) and get enough of them home before the clock runs out.",
        keys: "Click the power button to boot DOS · press 1, then Enter at the setup screens · pick a skill, click a lemming",
        more: [["Also on DOS Zone", "https://dos.zone/lemmings-1991/"]]
      }),
      vikings: Object.assign(IA("msdos_Lost_Vikings_The_1993"), {
        name: "The Lost Vikings", sub: "Silicon & Synapse (Blizzard) · Interplay, 1993", look: ["#ffd84a", "#b02020", "#3a0a0a"], byo: true,
        blurb: "Erik the Swift, Baleog the Fierce and Olaf the Stout get beamed aboard an alien zoo. Only all three, working together, get out alive.",
        keys: "Click the power button to boot DOS · arrows move · Ctrl swaps viking",
        more: [["Blizzard Arcade Collection", "https://shop.battle.net/product/blizzard-arcade-collection"], ["Also on DOS Zone", "https://dos.zone/the-lost-vikings-1993/"]]
      }),
      ihnm: Object.assign(IA("msdos_I_Have_No_Mouth_and_I_Must_Scream_1995"), {
        name: "I Have No Mouth, and I Must Scream", sub: "Cyberdreams / The Dreamers Guild, 1995", look: ["#ff3a3a", "#3a0000", "#1a0000"], byo: true,
        blurb: "Harlan Ellison's story, as an adventure: AM has kept five humans alive for 109 years to torment them. Each gets a scenario of their own. Dark, and meant to be.",
        keys: "Click the power button to boot DOS · point and click",
        more: [["On GOG", "https://www.gog.com/en/game/i_have_no_mouth_and_i_must_scream"], ["Also on DOS Zone", "https://dos.zone/ihave-no-mouth-andi-must-scream/"]]
      })
    };

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const g = GAMES[new URLSearchParams(location.search).get("g")];
    if (!g) { $("name").textContent = "Game Over"; $("blurb").textContent = "No game by that name in this cabinet."; }
    else {
      document.title = g.name;
      const [ink, shade, glow] = g.look, ts = document.documentElement.style;
      ts.setProperty("--ink", ink); ts.setProperty("--shade", shade); ts.setProperty("--glow", glow); ts.setProperty("--glow2", ink + "55");
      $("name").textContent = g.name; $("sub").textContent = g.sub; $("blurb").textContent = g.blurb;
      $("keys").textContent = g.keys;
      const hostLink = `<a href="${esc(g.hostUrl)}" target="_blank" rel="noopener">${esc(g.host)}</a>`;
      $("credit").innerHTML = (g.credit ? esc(g.credit) + " · " : "") + "hosted by " + hostLink + ` · <a href="${esc(g.page)}" target="_blank" rel="noopener">${esc((g.altLabel || "open in new window").toLowerCase())}</a>`;
      const more = (g.more || []).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`);
      $("meta").innerHTML = (g.why ? esc(g.why) + "<br>" : "") + "Plays from " + hostLink + "." + (more.length ? "<br>" + more.join(" · ") : "");
      const btns = $("btns");
      const openNew = () => window.open(g.page, "_blank", "noopener");
      if (g.embed) {
        const play = document.createElement("button"); play.className = "btn go"; play.textContent = g.playLabel || "▶ Play";
        play.addEventListener("click", () => {
          const f = document.createElement("iframe");
          f.src = g.embed; f.title = g.name; f.allow = "autoplay; fullscreen; gamepad"; f.allowFullscreen = true;
          if (g.native) {
            // the host's player has a fixed-size screen: frame it at that size and scale it to the window
            const [nw, nh] = g.native, st = $("stage");
            Object.assign(f.style, { width: nw + "px", height: nh + "px", left: "50%", top: "50%", inset: "auto", transformOrigin: "0 0" });
            const fit = () => { const s = Math.min(st.clientWidth / nw, st.clientHeight / nh); f.style.left = (st.clientWidth - nw * s) / 2 + "px"; f.style.top = (st.clientHeight - nh * s) / 2 + "px"; f.style.transform = `scale(${s})`; };
            addEventListener("resize", fit); requestAnimationFrame(fit);
          }
          $("stage").appendChild(f); $("title").hidden = true; f.focus();
          try { parent.postMessage({ type: "win-title", title: g.name }, location.origin); } catch (e) {}
        });
        btns.appendChild(play);
      }
      const nw = document.createElement("button"); nw.className = "btn" + (g.embed ? "" : " go"); nw.textContent = g.altLabel || (g.embed ? "Open in new window" : "▶ Play on " + g.host);
      nw.addEventListener("click", openNew); btns.appendChild(nw);
      if (g.byo) {
        const own = document.createElement("button"); own.className = "btn"; own.textContent = "Run my own copy";
        own.title = "Boot a copy you own in this site's DOSBox (stays in your browser)";
        own.addEventListener("click", () => { location.href = "../dos/play.html?g=" + encodeURIComponent(new URLSearchParams(location.search).get("g")); });
        btns.appendChild(own);
      }
    }
  </script>
</body>
</html>
