<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dominic Cerchio — an archive of retired web apps, kept here as a museum.">
  <title>dominiccerchio — archived</title>
  <style>
    :root {
      --bg: #050a05;
      --bg-2: #081208;
      --phosphor: #3dff7a;
      --phosphor-dim: #1f8f43;
      --phosphor-glow: rgba(61, 255, 122, 0.55);
      --amber: #ffcf6a;
      --magenta: #f012be;
      --rule: rgba(61, 255, 122, 0.25);
      --ink: #bdf5cd;
      --danger: #ff5f56;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at center, var(--bg-2) 0%, var(--bg) 75%);
      color: var(--phosphor);
      font-family: "Courier New", "DejaVu Sans Mono", monospace;
      font-size: 16px;
      line-height: 1.6;
      text-shadow: 0 0 4px var(--phosphor-glow);
    }

    /* CRT scanlines + flicker overlay */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px);
      z-index: 9999; mix-blend-mode: multiply;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
      z-index: 9998; animation: flicker 6s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.92; } 48% { opacity: 0.96; } 50% { opacity: 0.82; } 52% { opacity: 0.97; }
    }

    main { position: relative; z-index: 1; min-height: 100vh; padding: 2rem 1.25rem; }

    .window {
      width: min(1080px, 100%); margin: 0 auto;
      border: 1px solid var(--phosphor-dim); border-radius: 6px;
      background: rgba(8, 18, 8, 0.6);
      box-shadow: 0 0 22px rgba(61,255,122,0.18), inset 0 0 60px rgba(61,255,122,0.04);
      overflow: hidden;
    }
    .titlebar {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.85rem;
      border-bottom: 1px solid var(--rule); background: rgba(61,255,122,0.06);
      font-size: 0.8rem; letter-spacing: 0.05em;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--phosphor-dim); }
    .dot.r { background: #ff5f56; } .dot.y { background: var(--amber); } .dot.g { background: var(--phosphor); }
    .titlebar .path { margin-left: auto; color: var(--phosphor-dim); }
    .titlebar a { color: var(--phosphor-dim); text-decoration: none; }
    .titlebar a:hover { color: var(--phosphor); }

    .screen { padding: 1.75rem 1.5rem 1.6rem; }

    .prompt { color: var(--phosphor-dim); }
    .prompt::before { content: "dominic@home:~$ "; color: var(--phosphor-dim); }

    h1.page-title {
      margin: 0.3rem 0 0.2rem; font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: 0.04em;
    }
    .lede { margin: 0 0 1.3rem; color: var(--amber); font-style: italic; text-shadow: 0 0 5px rgba(255,207,106,0.5); }

    .note {
      margin: 0 0 1.5rem; padding: 0.65rem 0.9rem; font-size: 0.82rem; color: var(--ink);
      border: 1px dashed var(--rule); border-radius: 6px; background: rgba(61,255,122,0.03);
    }
    .note::before { content: "// "; color: var(--phosphor-dim); }

    /* Archived entries */
    .stack-list { display: grid; gap: 1.1rem; }
    .entry {
      border: 1px solid var(--rule); border-radius: 6px; padding: 1.1rem 1.15rem;
      background: rgba(61,255,122,0.03); position: relative;
    }
    .entry-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem; margin-bottom: 0.4rem; }
    .entry h2 {
      margin: 0; font-size: 1.15rem; letter-spacing: 0.02em; color: var(--phosphor);
    }
    .entry h2::before { content: "> "; color: var(--phosphor-dim); }
    .cat { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); }
    .badge {
      margin-left: auto; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--danger); border: 1px solid var(--danger); border-radius: 999px; padding: 0.1rem 0.6rem;
      text-shadow: 0 0 4px rgba(255,95,86,0.45);
    }
    .entry .desc { margin: 0 0 0.7rem; font-size: 0.9rem; color: var(--ink); }
    .stack { margin: 0; font-size: 0.78rem; color: var(--phosphor-dim); }
    .stack::before { content: "stack: "; color: var(--phosphor-dim); }
    .stack span {
      display: inline-block; color: var(--phosphor); border: 1px solid var(--rule); border-radius: 4px;
      padding: 0.02rem 0.45rem; margin: 0.1rem 0.25rem 0.1rem 0; font-size: 0.74rem;
    }

    .count { color: var(--phosphor-dim); font-size: 0.8rem; margin: 1.4rem 0 0; }

    @media (prefers-reduced-motion: reduce) { body::after { animation: none; } }
    @media (max-width: 640px) { .screen { padding: 1.25rem 1rem; } }
  </style>
</head>
<body>
  <main>
    <div class="window">
      <div class="titlebar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <a href="../website/apps.html" title="Back to apps">&larr; apps</a>
        <span class="path">~/apps/archived</span>
      </div>
      <div class="screen">
        <div class="prompt">cat ./archived</div>
        <h1 class="page-title">Archived</h1>
        <p class="lede">A museum of retired apps &mdash; preserved here as documentation, no longer running.</p>
        <p class="note">These projects have been decommissioned and their source files removed. What remains is a record of what they were and how they were built.</p>

        <div class="stack-list" id="list"></div>
        <p class="count" id="count"></p>
      </div>
    </div>
  </main>

  <script>
  "use strict";

  function h(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

  /* ============================ archive registry ============================ */
  /* Retired apps. Each entry is documentation only — the original source has
     been removed. To archive a new app, add an entry here. */
  var archived = [
    {
      title: "Overwatch Workshop Repository",
      cat: "Games",
      desc: "A community board for Blizzard's Overwatch Workshop. Players browsed shared custom maps in a sortable table, copied a code by clicking a cell, submitted their own \"forge\" through a modal form, swapped between several table themes, and exported the listing as CSV, XLSX, PDF, or JSON.",
      stack: ["Bootstrap 4", "Tabulator.js", "Firebase Realtime DB", "Google Fonts"]
    },
    {
      title: "Raspberry Pi Designer",
      cat: "Tools",
      desc: "A kit configurator for the Raspberry Pi. You picked a board (Pi 0, 3, or 4), browsed components across categories \u2014 cases, storage, power, controllers, travel, and accessories \u2014 compared boards in a hardware specification table, and followed links out to Amazon for details and pricing.",
      stack: ["Bootstrap 4", "Carousel + Modals", "Dropdowns"]
    },
    {
      title: "Garage to Table (G2T)",
      cat: "Tools",
      desc: "A materials & price calculator for a line of 3D woodworking models. You chose a model, then saw its full bill of materials with per-item pricing and retail links to source each part.",
      stack: ["Bootstrap 5", "Bootstrap Icons", "models.js / modelpicker.js"]
    }
  ];

  /* ============================ render archive ============================ */
  var list = document.getElementById("list");
  var countEl = document.getElementById("count");

  archived.sort(function (a, z) { return a.title.localeCompare(z.title); });
  archived.forEach(function (a) {
    var stack = a.stack.map(function (s) { return "<span>" + esc(s) + "</span>"; }).join("");
    var entry = h(
      '<div class="entry">' +
        '<div class="entry-head">' +
          '<span class="cat">' + esc(a.cat) + "</span>" +
          "<h2>" + esc(a.title) + "</h2>" +
          '<span class="badge">retired</span>' +
        "</div>" +
        '<p class="desc">' + esc(a.desc) + "</p>" +
        '<p class="stack">' + stack + "</p>" +
      "</div>"
    );
    list.appendChild(entry);
  });

  countEl.textContent = "// " + archived.length + " archived app" + (archived.length === 1 ? "" : "s");
  </script>
</body>
</html>
