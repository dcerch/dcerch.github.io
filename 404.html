      .theme-brutalist { background:#fff; color:#000; font-family: "Helvetica Neue", Arial, sans-serif; }
      .theme-brutalist .wrap { position:relative; width:100%; height:100%; }
      .theme-brutalist .huge { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); margin:0;
        font-size: 56vw; font-weight:900; line-height:.8; letter-spacing:-.04em; }
      .theme-brutalist .tl { position:absolute; top:4vmin; left:4vmin; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
      .theme-brutalist .br { position:absolute; bottom:4vmin; right:4vmin; text-align:right; text-transform:uppercase; letter-spacing:.1em; font-weight:700; }
      .theme-brutalist .bl { position:absolute; bottom:4vmin; left:4vmin; max-width:40ch; border-top:4px solid #000; padding-top:1vmin; }
      .theme-brutalist .home { color:#000; }

      /* =========================================================
         14. LAVA LAMP
         ========================================================= */
      .theme-lavalamp { background: linear-gradient(#3a0d4a 0%, #7a1457 50%, #c23a2e 100%); overflow:hidden; }
      .theme-lavalamp .blob { position:absolute; border-radius:50%;
        background: radial-gradient(circle at 35% 30%, #ffd36b, #ff7a3c 55%, #e23d6b); filter: blur(2px); opacity:.92;
        animation: blob-rise ease-in-out infinite; }
      @keyframes blob-rise {
        0%   { transform: translateY(10vh) scale(1); border-radius:50% 50% 48% 52%/52% 48% 50% 50%; }
        50%  { transform: translateY(-55vh) scale(1.25); border-radius:46% 54% 55% 45%/55% 45% 52% 48%; }
        100% { transform: translateY(10vh) scale(1); border-radius:50% 50% 48% 52%/52% 48% 50% 50%; }
      }
      .theme-lavalamp h1 { position:relative; z-index:3; margin:0; font-size: clamp(80px,22vmin,200px); font-weight:800; color:#fff;
        mix-blend-mode: overlay; text-shadow:0 0 30px rgba(255,200,120,.5); }
      .theme-lavalamp .tag { position:absolute; z-index:3; bottom:8%; left:0; right:0; color:#ffe3cf; letter-spacing:.4em; text-transform:uppercase; font-size:clamp(11px,1.8vmin,15px); }

      /* =========================================================
         15. HYPERSPACE
         ========================================================= */
      .theme-hyperspace { background:#000; overflow:hidden; }
      .theme-hyperspace .streak { position:absolute; top:50%; left:50%; width:2px; height:2px; background:#fff;
        transform-origin: 0 0; animation: warp linear infinite; }
      @keyframes warp { from { transform: rotate(var(--a)) translateX(0) scaleX(1); opacity:0; }
        10% { opacity:1; } to { transform: rotate(var(--a)) translateX(75vmax) scaleX(60); opacity:0; } }
      .theme-hyperspace .center { position:relative; z-index:3; }
      .theme-hyperspace h1 { margin:0; font-size: clamp(70px,18vmin,160px); font-weight:800; color:#fff; text-shadow:0 0 30px rgba(120,170,255,.8); }
      .theme-hyperspace p { color:#9fb6ff; letter-spacing:.3em; text-transform:uppercase; font-size:clamp(11px,1.8vmin,15px); }

      /* =========================================================
         16. SOLARPUNK
         ========================================================= */
      .theme-solarpunk { background: linear-gradient(#fdf6da 0%, #eaf6cf 55%, #d2efb6 100%); color:#2c4a1e; font-family: "Segoe UI", system-ui, sans-serif; }
      .theme-solarpunk .sun { position:absolute; top:10%; left:50%; transform:translateX(-50%); width:30vmin; height:30vmin; border-radius:50%;
        background: radial-gradient(circle,#fff6c2,#ffd95e 60%,#ffb43c); box-shadow:0 0 12vmin #ffe79a; }
      .theme-solarpunk .vine { position:absolute; bottom:0; width:5vmin; height: 60vmin; background:linear-gradient(transparent,#3f7d2b); border-radius:3vmin; }
      .theme-solarpunk .leaf { position:absolute; width:6vmin; height:4vmin; background:#4f9e35; border-radius:0 80% 0 80%;
        box-shadow: inset 0 0 1vmin rgba(0,0,0,.15); animation: sway-leaf 5s ease-in-out infinite; }
      @keyframes sway-leaf { 0%,100%{transform:rotate(var(--r,0deg));} 50%{transform:rotate(calc(var(--r,0deg) + 8deg));} }
      .theme-solarpunk .center { position:relative; z-index:3; }
      .theme-solarpunk h1 { margin:0; font-size: clamp(80px,20vmin,200px); font-weight:800; color:#33611f; }
      .theme-solarpunk p { margin:.4em auto; max-width:34ch; color:#3c5a28; }
      .theme-solarpunk .home { color:#2c7a1e; }

      /* =========================================================
         REDUCED MOTION
         ========================================================= */
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
        .theme-arcade .coin, .theme-terminal .cursor, .theme-noir .type { animation: none !important; }
        .theme-noir .type { width: 30ch; border-right: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      "use strict";

      var HOME = "https://dominiccerchio.com/"; // return-home target for a 404 page

      function homeLink(text) {
        return '<a class="home" href="' + HOME + '">' + text + '</a>';
      }

      /* ----- shared helper: text scramble (matrix) ----- */
      function TextScramble(el) {
        this.el = el;
        this.chars = "!<>-_\\/[]{}\u2014=+*^?#________";
        this.update = this.update.bind(this);
      }
      TextScramble.prototype.setText = function (newText) {
        var self = this;
        var oldText = this.el.innerText;
        var length = Math.max(oldText.length, newText.length);
        var promise = new Promise(function (resolve) { self.resolve = resolve; });
        this.queue = [];
        for (var i = 0; i < length; i++) {
          var from = oldText[i] || "";
          var to = newText[i] || "";
          var start = Math.floor(Math.random() * 40);
          var end = start + Math.floor(Math.random() * 40);
          this.queue.push({ from: from, to: to, start: start, end: end });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      };
      TextScramble.prototype.update = function () {
        var output = "";
        var complete = 0;
        for (var i = 0, n = this.queue.length; i < n; i++) {
          var q = this.queue[i];
          if (this.frame >= q.end) { complete++; output += q.to; }
          else if (this.frame >= q.start) {
            if (!q.char || Math.random() < 0.28) { q.char = this.randomChar(); }
            output += '<span class="dud">' + q.char + "</span>";
          } else { output += q.from; }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) { this.resolve(); }
        else { this.frameRequest = requestAnimationFrame(this.update); this.frame++; }
      };
      TextScramble.prototype.randomChar = function () {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      };

      /* ================= THEME REGISTRY ================= */
      var THEMES = {

        space: {
          build: function () {
            return '' +
              '<div class="stars"></div><div class="stars2"></div>' +
              '<div class="earth"></div>' +
              '<div class="info">' +
                '<h1>404</h1>' +
                '<p>Actual live footage of trying to find the page you wanted&hellip; it\'s not looking so good.</p>' +
                '<p>Return to ' + homeLink("Earth") + '?</p>' +
              '</div>';
          }
        },

        starwars: {
          build: function () {
            return '' +
              '<div class="scene">' +
                '<div class="suns"><div class="sun"></div><div class="sun small"></div></div>' +
                '<h1>404</h1>' +
                '<div class="droids">' +
                  '<div class="threepio"></div>' +
                  '<div class="artoo"><div class="dome"></div><div class="body"></div><div class="eye"></div><div class="panel"></div></div>' +
                '</div>' +
                '<p>These aren\'t the pages you\'re looking for.</p>' +
                '<a class="btn home" href="' + HOME + '">Move Along</a>' +
              '</div>';
          }
        },

        matrix: {
          build: function () {
            return '' +
              '<div class="rain"></div>' +
              '<div class="center">' +
                '<h1>404</h1>' +
                '<div class="scramble">Wake up&hellip;</div>' +
                '<div class="cube-wrap"><div class="cube">' +
                  '<div class="front">404</div><div class="back">404</div>' +
                  '<div class="right">&#8962;</div><div class="left">&#8962;</div>' +
                  '<div class="top"></div><div class="bottom"></div>' +
                '</div></div>' +
                '<p>' + homeLink("Take the blue pill") + '</p>' +
              '</div>';
          },
          init: function (app) {
            // digital rain
            var rain = app.querySelector(".rain");
            var glyphs = "01\u30A2\u30AB\u30B5\u30BF\u30CA\u30CF\u30DE\u30E4\u30E9\u30EF";
            var cols = Math.min(40, Math.floor(window.innerWidth / 22));
            for (var c = 0; c < cols; c++) {
              var s = document.createElement("span");
              var len = 8 + Math.floor(Math.random() * 18);
              var txt = "";
              for (var k = 0; k < len; k++) { txt += glyphs[Math.floor(Math.random() * glyphs.length)] + "\n"; }
              s.textContent = txt;
              s.style.left = (c / cols * 100) + "%";
              s.style.animationDuration = (4 + Math.random() * 6) + "s";
              s.style.animationDelay = (-Math.random() * 8) + "s";
              rain.appendChild(s);
            }
            // scramble
            var el = app.querySelector(".scramble");
            var fx = new TextScramble(el);
            var phrases = ["Wake up\u2026", "the page you seek", "was never here", "follow the white rabbit", "404 not found"];
            var counter = 0;
            (function next() {
              fx.setText(phrases[counter]).then(function () { setTimeout(next, 1400); });
              counter = (counter + 1) % phrases.length;
            })();
          }
        },

        terminal: {
          build: function () {
            return '' +
              '<div class="win">' +
                '<div class="line">guest@dominiccerchio:~$ locate /page</div>' +
                '<div class="line err">locate: error code 404 &mdash; resource not found</div>' +
                '<div class="big">404</div>' +
                '<div class="line">The file you requested does not exist on this server.</div>' +
                '<div class="line">guest@dominiccerchio:~$ cd ' + homeLink("~") + '<span class="cursor"></span></div>' +
              '</div>';
          }
        },

        vaporwave: {
          build: function () {
            return '' +
              '<div class="sun"></div><div class="grid"></div>' +
              '<h1>404</h1>' +
              '<div class="tag">signal lost &middot; ' + homeLink("return home") + '</div>';
          }
        },

        arcade: {
          build: function () {
            return '' +
              '<div class="box">' +
                '<div class="go">GAME OVER</div>' +
                '<div class="ghost"><div class="feet"></div></div>' +
                '<div class="code">404</div>' +
                '<div class="coin">INSERT COIN TO CONTINUE</div>' +
                '<div>' + homeLink("&laquo; back to start") + '</div>' +
              '</div>';
          }
        },

        glitch: {
          build: function () {
            return '' +
              '<div class="stack">' +
                '<div class="g" data-text="404">404</div>' +
                '<div class="sub">signal lost</div>' +
                '<div class="sub">' + homeLink("re-establish connection") + '</div>' +
              '</div>';
          }
        },

        ocean: {
          build: function () {
            return '' +
              '<div class="rays"></div>' +
              '<div class="center">' +
                '<h1>404</h1>' +
                '<p>This page is lost at sea.</p>' +
                '<p>Swim back to ' + homeLink("the surface") + '.</p>' +
              '</div>';
          },
          init: function (app) {
            for (var r = 0; r < 4; r++) {
              var ray = document.createElement("div");
              ray.className = "ray";
              ray.style.left = (10 + r * 24) + "%";
              app.appendChild(ray);
            }
            for (var b = 0; b < 26; b++) {
              var d = document.createElement("div");
              d.className = "bubble";
              var size = 4 + Math.random() * 22;
              d.style.width = size + "px";
              d.style.height = size + "px";
              d.style.left = (Math.random() * 100) + "%";
              d.style.animationDuration = (6 + Math.random() * 10) + "s";
              d.style.animationDelay = (-Math.random() * 12) + "s";
              app.appendChild(d);
            }
          }
        },

        blueprint: {
          build: function () {
            return '' +
              '<div class="sheet">' +
                '<div class="stamp">NOT FOUND</div>' +
                '<h1>404</h1>' +
                '<div class="meta">DRAWING NO. 404 &middot; REV. &mdash; &middot; SHEET 1 OF 1</div>' +
                '<div class="meta">The requested component is missing from this assembly.</div>' +
                '<div class="meta">RETURN PATH: ' + homeLink("/ HOME") + '</div>' +
                '<div class="dim">404.00 mm</div>' +
              '</div>';
          }
        },

        bsod: {
          build: function () {
            return '' +
              '<div class="panel">' +
                '<div class="face">:(</div>' +
                '<p>Your page ran into a problem and couldn\'t be found. We\'re not collecting anything, we just couldn\'t locate it.</p>' +
                '<p class="pct"><span class="num">0</span>% complete</p>' +
                '<div class="small">' +
                  '<div class="qr"></div>' +
                  '<div>For more information about this issue, visit ' + homeLink("dominiccerchio.com") + '<br>Stop code: HTTP_PAGE_NOT_FOUND_404</div>' +
                '</div>' +
              '</div>';
          },
          init: function (app) {
            var num = app.querySelector(".num");
            var pct = 0;
            var t = setInterval(function () {
              pct += Math.floor(Math.random() * 8) + 1;
              if (pct >= 100) { pct = 100; clearInterval(t); }
              num.textContent = pct;
            }, 400);
          }
        },

        horror: {
          build: function () {
            return '' +
              '<div class="center">' +
                '<h1>404</h1>' +
                '<p>This page was never meant to be found.</p>' +
                '<p>Turn ' + homeLink("back") + ' while you still can.</p>' +
              '</div>';
          },
          init: function (app) {
            for (var i = 0; i < 6; i++) {
              var t = document.createElement("div");
              t.className = "tentacle";
              t.style.left = (4 + i * 17) + "%";
              t.style.animationDelay = (-Math.random() * 9) + "s";
              t.style.height = (50 + Math.random() * 40) + "vmin";
              app.appendChild(t);
            }
            var eye = document.createElement("div");
            eye.className = "eye";
            eye.style.top = "22%"; eye.style.left = "60%";
            app.appendChild(eye);
          }
        },

        noir: {
          build: function () {
            return '' +
              '<div class="blinds"></div>' +
              '<div class="card">' +
                '<h1>404</h1>' +
                '<div class="type">The page went missing&hellip;</div>' +
                '<p>Another dead end. The page skipped town and left no forwarding address. Time to head ' + homeLink("home") + ', detective.</p>' +
              '</div>';
          }
        },

        brutalist: {
          build: function () {
            return '' +
              '<div class="wrap">' +
                '<div class="tl">Error</div>' +
                '<h1 class="huge">404</h1>' +
                '<div class="bl">The page does not exist. No styling will bring it back.</div>' +
                '<div class="br">' + homeLink("Home &rarr;") + '</div>' +
              '</div>';
          }
        },

        lavalamp: {
          build: function () {
            return '<h1>404</h1><div class="tag">page not found &middot; ' + homeLink("go home") + '</div>';
          },
          init: function (app) {
            var n = 7;
            for (var i = 0; i < n; i++) {
              var b = document.createElement("div");
              b.className = "blob";
              var size = 14 + Math.random() * 26;
              b.style.width = size + "vmin";
              b.style.height = size + "vmin";
              b.style.left = (Math.random() * 90) + "%";
              b.style.animationDuration = (8 + Math.random() * 8) + "s";
              b.style.animationDelay = (-Math.random() * 10) + "s";
              app.insertBefore(b, app.firstChild);
            }
          }
        },

        hyperspace: {
          build: function () {
            return '' +
              '<div class="center">' +
                '<h1>404</h1>' +
                '<p>Wrong jump &middot; ' + homeLink("punch it home") + '</p>' +
              '</div>';
          },
          init: function (app) {
            for (var i = 0; i < 90; i++) {
              var s = document.createElement("div");
              s.className = "streak";
              s.style.setProperty("--a", (Math.random() * 360) + "deg");
              s.style.animationDuration = (0.6 + Math.random() * 1.6) + "s";
              s.style.animationDelay = (-Math.random() * 2) + "s";
              app.insertBefore(s, app.firstChild);
            }
          }
        },

        solarpunk: {
          build: function () {
            return '' +
              '<div class="sun"></div>' +
              '<div class="center">' +
                '<h1>404</h1>' +
                '<p>Nature reclaimed this page.</p>' +
                '<p>Wander back to ' + homeLink("the garden") + '.</p>' +
              '</div>';
          },
          init: function (app) {
            var positions = [3, 12, 80, 90, 50];
            for (var v = 0; v < positions.length; v++) {
              var vine = document.createElement("div");
              vine.className = "vine";
              vine.style.left = positions[v] + "%";
              vine.style.height = (40 + Math.random() * 35) + "vmin";
              app.appendChild(vine);
            }
            for (var l = 0; l < 16; l++) {
              var leaf = document.createElement("div");
              leaf.className = "leaf";
              leaf.style.left = (Math.random() * 100) + "%";
              leaf.style.bottom = (Math.random() * 55) + "vmin";
              leaf.style.setProperty("--r", (Math.random() * 360) + "deg");
              leaf.style.animationDelay = (-Math.random() * 5) + "s";
              app.appendChild(leaf);
            }
          }
        }

      };

      /* ================= BOOT ================= */
      (function () {
        var ids = Object.keys(THEMES);
        var params = new URLSearchParams(location.search);
        var pick = params.get("theme");
        if (!pick || !THEMES[pick]) {
          pick = ids[Math.floor(Math.random() * ids.length)];
        }
        document.body.classList.add("theme-" + pick);
        var app = document.getElementById("app");
        app.innerHTML = THEMES[pick].build();
        if (THEMES[pick].init) { THEMES[pick].init(app); }
      })();
    </script>
  </body>
</html>
