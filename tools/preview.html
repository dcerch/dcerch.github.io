<!doctype html>
<html><head><meta charset="utf-8"><title>asset preview</title>
<style>body{margin:0;background:#222;color:#fff;font:12px sans-serif}#g{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}figure{margin:0;background:#333}canvas{width:100%;display:block}figcaption{padding:2px 4px}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head><body><div id="g"></div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { loadModel } from "../js/assets.js";
const ids = new URLSearchParams(location.search).get("ids").split(",");
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(260, 220);
r.toneMapping = THREE.AgXToneMapping;
const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
for (const id of ids) {
  const scene = new THREE.Scene(); scene.environment = env; scene.background = new THREE.Color(0x555555);
  scene.add(new THREE.DirectionalLight(0xffffff, 2).translateX(2).translateY(3).translateZ(3));
  const m = (await loadModel(id)).clone(); scene.add(m);
  const b = new THREE.Box3().setFromObject(m), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(35, 260 / 220, 0.01, 100), d = Math.max(s.x, s.y, s.z) * 2.2;
  cam.position.set(c.x + d * 0.45, c.y + d * 0.35, c.z + d); cam.lookAt(c); // looking from +z (front?)
  r.render(scene, cam);
  const fig = document.createElement("figure"); const cv = document.createElement("canvas"); cv.width = 260; cv.height = 220;
  cv.getContext("2d").drawImage(r.domElement, 0, 0);
  fig.append(cv); const cap = document.createElement("figcaption"); cap.textContent = `${id} ${s.x.toFixed(2)}×${s.y.toFixed(2)}×${s.z.toFixed(2)}`; fig.append(cap);
  document.getElementById("g").append(fig);
}
document.title = "done";
</script></body></html>
