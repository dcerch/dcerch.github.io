<!doctype html>
<html lang="en">
  <head>
    <!-- Browser -->
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <!-- Favicon & page title -->
    <link rel="icon" href="../../../home/img/logo/green/favicon-32x32.png">
    <title>dominiccerchio</title>

    <!-- Bootstrap core CSS -->
    <link href="../../../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div id="projectCookie">
      <div class="card-body">
        <h1 class="display-4">Picture Spacer</h1>
        <p class="lead">Calculate the spacing when hanging art on the wall.</p>
        <div style="max-width: 30rem;">
          <div class="mb-2">
            <label for="wallWidth" class="form-label">How wide is the wall you want to cover?</label>
            <input type="number" min="1" step="1" class="form-control" id="wallWidth" placeholder="Round down to the nearest inch or foot" onkeypress="return (event.charCode == 8 || event.charCode == 0 || event.charCode == 13) ? null : event.charCode >= 48 && event.charCode <= 57">
          </div>
          <div class="mb-2">
            <label for="artWidth" class="form-label">How wide is the art?</label>
            <input type="number" min="1" step="1" class="form-control" id="artWidth" placeholder="Round down to the nearest inch or foot" onkeypress="return (event.charCode == 8 || event.charCode == 0 || event.charCode == 13) ? null : event.charCode >= 48 && event.charCode <= 57">
          </div>
          <div class="mb-2">
            <label for="artCount" class="form-label">How many pieces of art?</label>
            <input type="number" min="1" step="1" class="form-control" id="artCount" placeholder="Any whole number" onkeypress="return (event.charCode == 8 || event.charCode == 0 || event.charCode == 13) ? null : event.charCode >= 48 && event.charCode <= 57">
          </div>
          <div>
            <label for="artCount" class="form-label">Art spacing calculation</label>
            <input type="text" class="form-control" id="artSpacing" placeholder="Approximately the spacing needed" readonly>
          </div>
        </div>
        <div class="mt-5" id="alignmentView">
          <table class="table table-bordered border-dark table-sm">
            <tr class="table-secondary text-center">
              <th class="py-2" scope="col" colspan="20">Where the art is placed on your wall (assuming center hanging) with a ruler for reference</th>
            </tr>
            <tr class="text-right">
              <td class="py-2">01</td>
              <td class="py-2">02</td>
              <td class="py-2">03</td>
              <td class="py-2">04</td>
              <td class="py-2">05</td>
              <td class="py-2">06</td>
              <td class="py-2">07</td>
              <td class="py-2">08</td>
              <td class="py-2">09</td>
              <td class="py-2">10</td>
              <td class="py-2">11</td>
              <td class="py-2">12</td>
              <td class="py-2">13</td>
              <td class="py-2">14</td>
              <td class="py-2">15</td>
              <td class="py-2">16</td>
              <td class="py-2">17</td>
              <td class="py-2">18</td>
              <td class="py-2">19</td>
              <td class="py-2">20</td>
            </tr>
            <tr class="text-center">
              <td class="py-5"></td>
              <td class="py-5 bg-dark text-light" colspan="2">Art #1</td>
              <td class="py-5"></td>
              <td class="py-5"></td>
              <td class="py-5 bg-dark text-light" colspan="2">Art #2"</td>
              <td class="py-5"></td>
              <td class="py-5"></td>
              <td class="py-5 bg-dark text-light" colspan="2">Art #3</td>
              <td class="py-5"></td>
              <td class="py-5"></td>
              <td class="py-5 bg-dark text-light" colspan="2">Art #4</td>
              <td class="py-5"></td>
              <td class="py-5"></td>
              <td class="py-5 bg-dark text-light" colspan="2">Art #5</td>
              <td class="py-5"></td>
            </tr>
          </table>
        </div>
      </div>
    </div>

    <!-- Vendor JS -->
    <script src="../../../vendor/jquery/js/jquery-3.4.1.min.js"></script>
    <script src="../../../vendor/tether/js/tether.min.js"></script>
    <script src="../../../vendor/popper/js/popper.min.js"></script>
    <script src="../../../vendor/popper/js/tooltip.min.js"></script>
    <script src="../../../vendor/bootstrap/js/bootstrap.min.js"></script>

  	<!-- Custom JS -->
    <script src="calculatespace.js"></script>
  </body>
</html>
