<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dominic Cerchio — a toolbox of small web app tools and experiments.">
  <title>dominiccerchio — toolbox</title>
  <style>
    :root {
      --bg: #050a05;
      --bg-2: #081208;
      --phosphor: #3dff7a;
      --phosphor-dim: #1f8f43;
      --phosphor-glow: rgba(61, 255, 122, 0.55);
      --amber: #ffcf6a;
      --magenta: #f012be;
      --rule: rgba(61, 255, 122, 0.25);
      --ink: #bdf5cd;
      --danger: #ff5f56;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at center, var(--bg-2) 0%, var(--bg) 75%);
      color: var(--phosphor);
      font-family: "Courier New", "DejaVu Sans Mono", monospace;
      font-size: 16px;
      line-height: 1.6;
      text-shadow: 0 0 4px var(--phosphor-glow);
    }

    /* CRT scanlines + flicker overlay */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px);
      z-index: 9999; mix-blend-mode: multiply;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
      z-index: 9998; animation: flicker 6s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.92; } 48% { opacity: 0.96; } 50% { opacity: 0.82; } 52% { opacity: 0.97; }
    }

    main { position: relative; z-index: 1; min-height: 100vh; padding: 2rem 1.25rem; }

    .window {
      width: min(1080px, 100%); margin: 0 auto;
      border: 1px solid var(--phosphor-dim); border-radius: 6px;
      background: rgba(8, 18, 8, 0.6);
      box-shadow: 0 0 22px rgba(61,255,122,0.18), inset 0 0 60px rgba(61,255,122,0.04);
      overflow: hidden;
    }
    .titlebar {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.85rem;
      border-bottom: 1px solid var(--rule); background: rgba(61,255,122,0.06);
      font-size: 0.8rem; letter-spacing: 0.05em;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--phosphor-dim); }
    .dot.r { background: #ff5f56; } .dot.y { background: var(--amber); } .dot.g { background: var(--phosphor); }
    .titlebar .path { margin-left: auto; color: var(--phosphor-dim); }
    .titlebar a { color: var(--phosphor-dim); text-decoration: none; }
    .titlebar a:hover { color: var(--phosphor); }

    .screen { padding: 1.75rem 1.5rem 1.6rem; }

    .prompt { color: var(--phosphor-dim); }
    .prompt::before { content: "dominic@home:~$ "; color: var(--phosphor-dim); }

    h1.page-title {
      margin: 0.3rem 0 0.2rem; font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: 0.04em;
    }
    .lede { margin: 0 0 1.3rem; color: var(--amber); font-style: italic; text-shadow: 0 0 5px rgba(255,207,106,0.5); }

    /* Filter chips */
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.4rem; }
    .chip {
      font: inherit; cursor: pointer; color: var(--phosphor); background: transparent;
      border: 1px solid var(--phosphor-dim); border-radius: 999px; padding: 0.25rem 0.85rem;
      font-size: 0.82rem; letter-spacing: 0.04em; transition: background 0.15s, box-shadow 0.15s;
    }
    .chip:hover { background: rgba(61,255,122,0.12); }
    .chip[aria-pressed="true"] { background: var(--phosphor-dim); color: #04130a; font-weight: 700; box-shadow: 0 0 12px var(--phosphor-glow); }

    /* Card grid */
    .grid { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .card {
      text-align: left; font: inherit; color: var(--phosphor); cursor: pointer;
      background: rgba(61,255,122,0.03); border: 1px solid var(--rule); border-radius: 6px;
      padding: 1rem 1.05rem; transition: background 0.15s, box-shadow 0.15s, transform 0.1s, border-color 0.15s;
      display: flex; flex-direction: column; gap: 0.35rem; min-height: 116px;
    }
    .card:hover { background: rgba(61,255,122,0.1); border-color: var(--phosphor-dim); box-shadow: 0 0 16px var(--phosphor-glow); transform: translateY(-2px); }
    .card:active { transform: translateY(0); }
    .card h3 { margin: 0; font-size: 1rem; letter-spacing: 0.02em; }
    .card h3::before { content: "> "; color: var(--phosphor-dim); }
    .card .desc { margin: 0; font-size: 0.82rem; color: var(--ink); flex: 1; }
    .card .cat { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); }
    .card.is-hidden { display: none; }
    .count { color: var(--phosphor-dim); font-size: 0.8rem; margin: 1.1rem 0 0; }

    /* ---- Dialog / app shell ---- */
    dialog#appModal {
      width: min(880px, 94vw); max-height: 92vh; border: 1px solid var(--phosphor-dim); border-radius: 6px;
      background: rgba(6, 14, 6, 0.98); color: var(--phosphor);
      box-shadow: 0 0 40px rgba(61,255,122,0.25); padding: 0; overflow: hidden;
    }
    dialog#appModal::backdrop { background: rgba(0,0,0,0.78); }
    .dlg-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--rule); background: rgba(61,255,122,0.06);
    }
    .dlg-head h2 { margin: 0; font-size: 1.05rem; letter-spacing: 0.06em; }
    .dlg-head h2::before { content: "~/"; color: var(--phosphor-dim); }
    .dlg-close {
      font: inherit; cursor: pointer; color: var(--phosphor); background: transparent;
      border: 1px solid var(--phosphor-dim); border-radius: 4px; padding: 0.1rem 0.6rem;
    }
    .dlg-close:hover { background: rgba(61,255,122,0.12); }
    .dlg-body { padding: 1.2rem 1.3rem 1.5rem; overflow-y: auto; max-height: calc(92vh - 52px); }

    /* ---- Reusable component kit (inside modals) ---- */
    .app-lede { color: var(--amber); font-style: italic; margin: 0 0 1rem; }
    .field { margin-bottom: 0.85rem; }
    .field > label { display: block; font-size: 0.82rem; color: var(--phosphor-dim); margin-bottom: 0.25rem; letter-spacing: 0.04em; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .row > .field { flex: 1 1 160px; margin-bottom: 0; }
    input, select, textarea {
      font: inherit; width: 100%; color: var(--phosphor); background: rgba(0,0,0,0.35);
      border: 1px solid var(--phosphor-dim); border-radius: 4px; padding: 0.45rem 0.6rem;
    }
    input::placeholder, textarea::placeholder { color: rgba(61,255,122,0.4); }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 10px var(--phosphor-glow); border-color: var(--phosphor); }
    select option { background: #081208; color: var(--phosphor); }
    textarea { resize: vertical; min-height: 80px; }
    .btn {
      font: inherit; cursor: pointer; color: var(--phosphor); background: transparent;
      border: 1px solid var(--phosphor-dim); border-radius: 4px; padding: 0.45rem 0.95rem;
      transition: background 0.15s, box-shadow 0.15s; margin: 0.15rem 0.35rem 0.15rem 0;
    }
    .btn:hover { background: rgba(61,255,122,0.12); box-shadow: 0 0 12px var(--phosphor-glow); }
    .btn::before { content: "> "; color: var(--phosphor-dim); }
    .btn.plain::before { content: ""; }
    .btn.danger { border-color: var(--danger); color: var(--danger); }
    .btn.danger:hover { background: rgba(255,95,86,0.14); box-shadow: 0 0 12px rgba(255,95,86,0.4); }
    .btn-row { margin: 0.4rem 0 0.9rem; }

    table { width: 100%; border-collapse: collapse; margin: 0.6rem 0 0.9rem; font-size: 0.88rem; }
    th, td { text-align: left; padding: 0.4rem 0.55rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
    th { color: var(--amber); font-weight: 700; letter-spacing: 0.04em; }
    tbody tr:nth-child(odd) td { background: rgba(61,255,122,0.03); }
    tr.best td { background: rgba(61,255,122,0.14); }
    td ul, th ul { margin: 0.2rem 0 0; padding-left: 1.1rem; }

    .note { font-size: 0.78rem; color: var(--phosphor-dim); margin-top: 0.6rem; }
    .note a, .dlg-body a { color: var(--amber); }
    .warn {
      display: inline-block; border: 1px dashed var(--amber); color: var(--amber);
      padding: 0.1rem 0.55rem; border-radius: 4px; font-size: 0.78rem; letter-spacing: 0.08em; margin-bottom: 0.8rem;
    }
    .result { color: var(--amber); font-weight: 700; }
    .pos { color: var(--phosphor); } .neg { color: var(--danger); }
    .mono-out {
      background: rgba(0,0,0,0.4); border: 1px solid var(--rule); border-radius: 4px;
      padding: 0.6rem 0.7rem; font-size: 0.82rem; word-break: break-all; white-space: pre-wrap; margin: 0.4rem 0;
    }
    .tag { font-size: 0.72rem; color: var(--phosphor-dim); }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem; }
    .indicators { display: grid; gap: 0.6rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .ind { border: 1px solid var(--rule); border-radius: 4px; padding: 0.6rem 0.7rem; }
    .ind .k { font-size: 0.7rem; color: var(--phosphor-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .ind .v { font-size: 0.95rem; color: var(--amber); }
    .progress { height: 10px; border: 1px solid var(--phosphor-dim); border-radius: 999px; overflow: hidden; background: rgba(0,0,0,0.4); margin: 0.5rem 0; }
    .progress > span { display: block; height: 100%; width: 0; background: var(--phosphor); transition: width 0.3s ease; }
    .ruler { display: flex; border: 1px solid var(--phosphor-dim); border-radius: 4px; overflow: hidden; margin: 0.6rem 0; }
    .ruler .seg { flex: 1; text-align: center; font-size: 0.7rem; padding: 0.3rem 0; border-right: 1px solid var(--rule); }
    .ruler .seg:last-child { border-right: 0; }
    .ruler .seg.art { background: var(--phosphor-dim); color: #04130a; }
    canvas { max-width: 100%; background: #04130a; border: 1px solid var(--phosphor-dim); border-radius: 4px; }
    iframe { width: 100%; height: 460px; border: 1px solid var(--phosphor-dim); border-radius: 4px; }
    .cards-mini { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .cards-mini .mini { border: 1px solid var(--rule); border-radius: 4px; padding: 0.7rem 0.8rem; }
    .cards-mini .mini h4 { margin: 0 0 0.3rem; font-size: 0.95rem; }
    .ticket { border: 1px dashed var(--phosphor-dim); border-radius: 6px; padding: 0.8rem; margin: 0.6rem 0; display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
    .ticket .meta { flex: 1; min-width: 160px; }
    .swatch { width: 100%; height: 120px; border: 1px solid var(--phosphor-dim); border-radius: 6px; margin: 0.6rem 0; }

    @media (prefers-reduced-motion: reduce) { body::after { animation: none; } }
    @media (max-width: 640px) { .screen { padding: 1.25rem 1rem; } .dlg-body { padding: 1rem; } }
  </style>
</head>
<body>
  <main>
    <div class="window">
      <div class="titlebar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <a href="index.html" title="Back home">&larr; home</a>
        <span class="path">~/toolbox</span>
      </div>
      <div class="screen">
        <div class="prompt">ls ./toolbox</div>
        <h1 class="page-title">Toolbox</h1>
        <p class="lede">A junk drawer of little web apps — calculators, tools, games, and half-finished experiments. Click one to run it right here.</p>

        <div class="filters" id="filters"></div>
        <div class="grid" id="grid"></div>
        <p class="count" id="count"></p>
      </div>
    </div>
  </main>

  <dialog id="appModal">
    <div class="dlg-head">
      <h2 id="appTitle">snippet</h2>
      <button class="dlg-close" id="appClose" aria-label="Close">esc</button>
    </div>
    <div class="dlg-body" id="appBody"></div>
  </dialog>

  <script>
  "use strict";

  /* ============================ tiny helpers ============================ */
  function h(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function money(n) { return "$" + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function signedMoney(n) { var v = Number(n) || 0; return (v >= 0 ? "+" : "\u2212") + "$" + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

  /* ============================ snippet registry ============================ */
  var apps = [];
  function app(def) { apps.push(def); }

  /* ---- Finance: Bank Rewards ---- */
  app({
    id: "bankrewards", title: "bankrewards", cat: "Finance",
    desc: "Compare the redemption value of your bank reward points across cards.",
    render: function (b) {
      var tiers = [
        { name: "Chase Sapphire Reserve", method: "Travel portal (1.5\u00a2)", cpp: 0.015 },
        { name: "Chase Sapphire Preferred", method: "Travel portal (1.25\u00a2)", cpp: 0.0125 },
        { name: "Chase Ink Business Preferred", method: "Travel portal (1.25\u00a2)", cpp: 0.0125 },
        { name: "Chase Freedom", method: "Cash back (1\u00a2)", cpp: 0.01 },
        { name: "Chase Freedom Unlimited", method: "Cash back (1\u00a2)", cpp: 0.01 }
      ];
      b.innerHTML =
        '<p class="app-lede">Find the best value for your bank\u2019s points.</p>' +
        '<div class="field"><label>Number of reward points</label><input type="number" min="0" id="br-pts" placeholder="e.g. 60000"></div>' +
        '<table><thead><tr><th>Card</th><th>Redemption</th><th>Value / point</th><th>Total value</th></tr></thead><tbody id="br-rows"></tbody></table>' +
        '<p class="note">Focuses purely on the redemption options banks provide. Cashing out and investing may yield more.</p>';
      var pts = b.querySelector("#br-pts"), rows = b.querySelector("#br-rows");
      function draw() {
        var p = Number(pts.value) || 0;
        var best = Math.max.apply(null, tiers.map(function (t) { return t.cpp; }));
        rows.innerHTML = tiers.map(function (t) {
          return '<tr class="' + (t.cpp === best && p > 0 ? "best" : "") + '"><td>' + esc(t.name) + '</td><td>' + esc(t.method) +
            '</td><td>' + (t.cpp * 100).toFixed(2) + '\u00a2</td><td class="result">' + money(p * t.cpp) + '</td></tr>';
        }).join("");
      }
      pts.addEventListener("input", draw); draw();
    }
  });

  /* ---- Finance: Crypto gain/loss ---- */
  app({
    id: "crypto", title: "crypto", cat: "Finance",
    desc: "Track crypto gains/losses by entering your buys and a current price. No live feed.",
    render: function (b) {
      b.innerHTML =
        '<p class="app-lede">Enter each position to see your gain/loss. Everything stays in your browser.</p>' +
        '<table><thead><tr><th>Coin</th><th>Amount</th><th>Buy price</th><th>Current price</th><th>Gain/Loss</th><th></th></tr></thead><tbody id="cy-rows"></tbody></table>' +
        '<div class="btn-row"><button class="btn" id="cy-add">Add position</button></div>' +
        '<h3 style="margin:0.4rem 0 0">Total: <span class="result" id="cy-total">$0.00</span></h3>';
      var rows = b.querySelector("#cy-rows"), total = b.querySelector("#cy-total");
      function addRow(coin) {
        var tr = h('<tr>' +
          '<td><input style="width:80px" placeholder="BTC" value="' + (coin || "") + '"></td>' +
          '<td><input style="width:90px" type="number" min="0" step="any" placeholder="0"></td>' +
          '<td><input style="width:100px" type="number" min="0" step="any" placeholder="0"></td>' +
          '<td><input style="width:100px" type="number" min="0" step="any" placeholder="0"></td>' +
          '<td class="gl">$0.00</td><td><button class="btn danger plain" title="Remove">\u2715</button></td></tr>');
        rows.appendChild(tr);
        tr.querySelectorAll("input").forEach(function (i) { i.addEventListener("input", recalc); });
        tr.querySelector("button").addEventListener("click", function () { tr.remove(); recalc(); });
        recalc();
      }
      function recalc() {
        var sum = 0;
        rows.querySelectorAll("tr").forEach(function (tr) {
          var v = tr.querySelectorAll("input");
          var amt = Number(v[1].value) || 0, buy = Number(v[2].value) || 0, cur = Number(v[3].value) || 0;
          var gl = amt * cur - amt * buy; sum += gl;
          var cell = tr.querySelector(".gl");
          cell.textContent = signedMoney(gl);
          cell.className = "gl " + (gl >= 0 ? "pos" : "neg");
        });
        total.textContent = signedMoney(sum);
        total.className = "result " + (sum >= 0 ? "pos" : "neg");
      }
      b.querySelector("#cy-add").addEventListener("click", function () { addRow(""); });
      addRow("BTC");
    }
  });

  /* ---- Finance: Income Savings (compound interest) ---- */
  app({
    id: "incomesavings", title: "incomesavings", cat: "Finance",
    desc: "Project compound interest on a savings balance across several timeframes.",
    render: function (b) {
      b.innerHTML =
        '<p class="app-lede">Calculate the accrued interest from a savings account.</p>' +
        '<div class="row">' +
          '<div class="field"><label>Principal ($)</label><input type="number" min="0" id="is-p" placeholder="10000"></div>' +
          '<div class="field"><label>Accrual rate (%)</label><input type="number" min="0" step="0.01" id="is-r" value="0.06"></div>' +
          '<div class="field"><label>Frequency</label><select id="is-f"><option>Yearly</option><option>Monthly</option><option>Daily</option></select></div>' +
        '</div>' +
        '<table><thead><tr><th>1 Month</th><th>6 Months</th><th>1 Year</th><th>3 Years</th><th>5 Years</th><th>10 Years</th></tr></thead><tbody><tr id="is-out"></tr></tbody></table>';
      var p = b.querySelector("#is-p"), r = b.querySelector("#is-r"), f = b.querySelector("#is-f"), out = b.querySelector("#is-out");
      var years = [1 / 12, 0.5, 1, 3, 5, 10];
      function draw() {
        var P = Number(p.value) || 0, rate = (Number(r.value) || 0) / 100;
        var n = f.value === "Daily" ? 365 : f.value === "Monthly" ? 12 : 1;
        out.innerHTML = years.map(function (t) { return "<td>" + money(P * Math.pow(1 + rate / n, n * t)) + "</td>"; }).join("");
      }
      [p, r, f].forEach(function (e) { e.addEventListener("input", draw); }); draw();
    }
  });

  /* ---- Calc: PMP Calculator ---- */
  app({
    id: "pmpcalc", title: "pmpcalc", cat: "Tools",
    desc: "Estimate project work hours and split them across the PMP lifecycle phases.",
    render: function (b) {
      var phases = [["Initiation", 0.13], ["Planning", 0.24], ["Executing", 0.31], ["Monitoring & Controlling", 0.25], ["Closing", 0.07]];
      b.innerHTML =
        '<p class="app-lede">Approximate work hours and compare against a standard PMP lifecycle curve.</p>' +
        '<div class="row">' +
          '<div class="field"><label>Project start date</label><input type="date" id="pm-s"></div>' +
          '<div class="field"><label>Project end date</label><input type="date" id="pm-e"></div>' +
        '</div>' +
        '<table><thead><tr><th>PMP Phase</th><th>Involvement</th><th>Hours</th></tr></thead><tbody id="pm-rows"></tbody></table>' +
        '<p class="note">Based on 8-hour days, 5 days a week (business days only, no holidays/PTO). See ' +
        '<a href="https://www.interfacett.com/blogs/applying-for-the-pmp-exam-hours-what-about-my-hours/" target="_blank" rel="noopener">this blog</a> for PMP hour requirements.</p>';
      var s = b.querySelector("#pm-s"), e = b.querySelector("#pm-e"), rows = b.querySelector("#pm-rows");
      function bizDays(a, z) { var d = new Date(a), end = new Date(z), c = 0; if (isNaN(d) || isNaN(end) || d > end) return 0; while (d <= end) { var w = d.getDay(); if (w !== 0 && w !== 6) c++; d.setDate(d.getDate() + 1); } return c; }
      function draw() {
        var total = bizDays(s.value, e.value) * 8;
        rows.innerHTML = phases.map(function (p) {
          return "<tr><th>" + p[0] + "</th><td>" + Math.round(p[1] * 100) + "%</td><td class='result'>" + Math.round(total * p[1]).toLocaleString() + " h</td></tr>";
        }).join("") + "<tr><th>Total</th><td>100%</td><td class='result'>" + total.toLocaleString() + " h</td></tr>";
      }
      [s, e].forEach(function (x) { x.addEventListener("input", draw); }); draw();
    }
  });

  /* ---- Calc: Picture Spacer ---- */
  app({
    id: "picturespacer", title: "picturespacer", cat: "Tools",
    desc: "Evenly space artwork on a wall — get the exact gap between each piece.",
    render: function (b) {
      b.innerHTML =
        '<p class="app-lede">Hang a row of art with even gaps. Units are whatever you measure in.</p>' +
        '<div class="row">' +
          '<div class="field"><label>Wall width</label><input type="number" min="0" step="any" id="ps-w" value="120"></div>' +
          '<div class="field"><label>Each art width</label><input type="number" min="0" step="any" id="ps-a" value="16"></div>' +
          '<div class="field"><label># of pieces</label><input type="number" min="1" step="1" id="ps-n" value="3"></div>' +
        '</div>' +
        '<p>Gap between pieces (and at each end): <span class="result" id="ps-gap">0</span></p>' +
        '<div class="ruler" id="ps-ruler"></div>';
      var w = b.querySelector("#ps-w"), a = b.querySelector("#ps-a"), n = b.querySelector("#ps-n"),
          gap = b.querySelector("#ps-gap"), ruler = b.querySelector("#ps-ruler");
      function draw() {
        var W = Number(w.value) || 0, A = Number(a.value) || 0, N = Math.max(1, Math.floor(Number(n.value) || 1));
        var g = (W - A * N) / (N + 1);
        gap.textContent = g >= 0 ? g.toFixed(2) : "won\u2019t fit";
        gap.className = "result " + (g >= 0 ? "pos" : "neg");
        var segs = [], total = N * 2 + 1;

  app({
    id: "cookie", title: "cookie", cat: "Tools",
    desc: "A tiny demo of creating, reading, and deleting a browser cookie.",
    render: function (b) {
      // Real cookies silently fail on file:// pages, so detect support and
      // transparently fall back to a localStorage-backed store when needed.
      function cookiesWork() {
        try {
          document.cookie = "__ck_test=1;path=/";
          var ok = document.cookie.indexOf("__ck_test=1") > -1;
          document.cookie = "__ck_test=;path=/;max-age=0";
          return ok;
        } catch (e) { return false; }
      }
      var native = cookiesWork();
      var FB = "cookie_demo_fallback";
      function fbLoad() { try { return JSON.parse(localStorage.getItem(FB) || "{}"); } catch (e) { return {}; } }
      function fbSave(o) { localStorage.setItem(FB, JSON.stringify(o)); }
      var store = {
        set: function (name, val) {
          if (native) { document.cookie = encodeURIComponent(name) + "=" + encodeURIComponent(val) + ";path=/;max-age=86400"; }
          else { var o = fbLoad(); o[name] = val; fbSave(o); }
        },
        del: function (name) {
          if (native) { document.cookie = encodeURIComponent(name) + "=;path=/;max-age=0"; }
          else { var o = fbLoad(); delete o[name]; fbSave(o); }
        },
        all: function () {
          if (native) {
            return (document.cookie ? document.cookie.split(/;\s*/) : []).map(function (p) {
              var i = p.indexOf("="); return { k: decodeURIComponent(p.slice(0, i)), v: decodeURIComponent(p.slice(i + 1)) };
            });
          }
          var o = fbLoad(); return Object.keys(o).map(function (key) { return { k: key, v: o[key] }; });
        }
      };
      b.innerHTML =
        '<p class="app-lede">Set a named value and watch it persist (then delete it).</p>' +
        (native ? '' : '<div class="note">Real cookies are blocked in this context (e.g. opening the file directly), so this demo uses a <code>localStorage</code>-backed fallback that behaves the same way.</div>') +
        '<div class="row"><div class="field"><label>Name</label><input id="ck-k" value="demo"></div>' +
        '<div class="field"><label>Value</label><input id="ck-v" placeholder="hello"></div></div>' +
        '<div class="btn-row"><button class="btn" id="ck-set">Create</button><button class="btn danger" id="ck-del">Delete</button></div>' +
        '<div class="progress"><span id="ck-bar"></span></div>' +
        '<div class="field"><label>' + (native ? 'document.cookie' : 'stored values') + '</label><div class="mono-out" id="ck-out"></div></div>';
      var k = b.querySelector("#ck-k"), v = b.querySelector("#ck-v"), bar = b.querySelector("#ck-bar"), out = b.querySelector("#ck-out");
      function show() {
        var rows = store.all();
        out.textContent = rows.length ? rows.map(function (r) { return r.k + "=" + r.v; }).join("\n") : "(nothing stored for this page)";
      }
      function pulse() { bar.style.width = "100%"; setTimeout(function () { bar.style.width = "0"; }, 600); }
      b.querySelector("#ck-set").addEventListener("click", function () {
        if (!k.value) { k.focus(); return; } store.set(k.value, v.value); pulse(); show();
      });
      b.querySelector("#ck-del").addEventListener("click", function () {
        if (!k.value) { k.focus(); return; } store.del(k.value); pulse(); show();
      });

    }
  });

      var seed = Date.now() % 2147483647;

  app({
    id: "ticketgenerator", title: "ticketgenerator", cat: "Tools",
    desc: "Generate event tickets with unique IDs and a scannable-looking barcode.",
    render: function (b) {
      b.innerHTML =
        '<p class="app-lede">Spin up numbered event tickets, each with a unique code.</p>' +
        '<div class="row"><div class="field"><label>Event name</label><input id="tk-ev" value="Launch Party"></div>' +
        '<div class="field"><label>Organization</label><input id="tk-org" value="dominiccerchio"></div>' +
        '<div class="field"><label>How many</label><input type="number" min="1" max="20" id="tk-n" value="3"></div></div>' +
        '<button class="btn" id="tk-go">Create tickets</button><div id="tk-out"></div>';
      function barcode(canvas, code) {
        var ctx = canvas.getContext("2d"), w = canvas.width, hgt = canvas.height; ctx.clearRect(0, 0, w, hgt);
        ctx.fillStyle = "#3dff7a"; var x = 4;
        for (var i = 0; i < code.length && x < w - 4; i++) { var bw = (code.charCodeAt(i) % 4) + 1; if (i % 2 === 0) ctx.fillRect(x, 4, bw, hgt - 8); x += bw + 2; }
      }
      b.querySelector("#tk-go").addEventListener("click", function () {
        var ev = b.querySelector("#tk-ev").value || "Event", org = b.querySelector("#tk-org").value || "ORG";
        var n = Math.min(20, Math.max(1, Number(b.querySelector("#tk-n").value) || 1)), out = b.querySelector("#tk-out"); out.innerHTML = "";
        for (var i = 1; i <= n; i++) {
          var code = (org.slice(0, 3).toUpperCase()) + "-" + Date.now().toString(36).toUpperCase().slice(-4) + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
          var card = h('<div class="ticket"><div class="meta"><strong>' + esc(ev) + '</strong><br><span class="tag">' + esc(org) + ' \u2022 Ticket ' + i + " of " + n + '</span><br><span class="result">' + code + '</span></div><canvas width="180" height="56"></canvas></div>');
          out.appendChild(card); barcode(card.querySelector("canvas"), code);
        }
      });
    }
  });

  app({
    id: "timewrap", title: "timewrap", cat: "Tools",
    desc: "Run multiple labeled timers by labor category and track your total time.",
    render: function (b) {
      var cats = ["Premier - Presales Activity", "General Administration", "Meetings & Events", "New Hire Training",
        "Training Taken", "Standby / Bench Time", "Time Away", "Travel - Non-Util",
        "Service Delivery Management", "Reactive Service Management", "Cloud Consumption Management",
        "Advisory Services", "Travel (Non-Billable)", "Travel (Billable)"];
      b.innerHTML =
        '<p class="app-lede">Keep track of time spent across projects and categories.</p>' +
        '<div id="tw-list"></div>' +
        '<div class="btn-row"><button class="btn" id="tw-add">Add new timer</button></div>' +
        '<h3 style="margin:0">Total time: <span class="result" id="tw-total">00:00:00</span></h3>';
      var list = b.querySelector("#tw-list"), totalEl = b.querySelector("#tw-total");
      var timers = [];
      function fmt(s) { var p = function (x) { return String(x).padStart(2, "0"); }; return p(Math.floor(s / 3600)) + ":" + p(Math.floor(s / 60) % 60) + ":" + p(s % 60); }
      function updateTotal() { totalEl.textContent = fmt(timers.reduce(function (a, t) { return a + t.sec; }, 0)); }
      function addTimer() {
        var t = { sec: 0, running: false, iv: null };
        var row = h('<div class="row" style="align-items:flex-end;margin-bottom:.6rem">' +
          '<div class="field"><label>Label</label><input placeholder="Timer label"></div>' +
          '<div class="field"><label>Category</label><select><option disabled selected>Labor Category</option>' +
          cats.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("") + '</select></div>' +
          '<div class="field" style="flex:0 0 110px"><label>Elapsed</label><input class="disp" readonly value="00:00:00"></div>' +
          '<div style="flex:0 0 auto"><button class="btn toggle">Start</button><button class="btn danger plain rm" title="Remove">\u2715</button></div></div>');
        var disp = row.querySelector(".disp"), toggle = row.querySelector(".toggle");
        toggle.addEventListener("click", function () {
          t.running = !t.running;
          if (t.running) { toggle.textContent = "Pause"; t.iv = setInterval(function () { t.sec++; disp.value = fmt(t.sec); updateTotal(); }, 1000); }
          else { toggle.textContent = "Start"; clearInterval(t.iv); }
        });
        row.querySelector(".rm").addEventListener("click", function () { clearInterval(t.iv); timers.splice(timers.indexOf(t), 1); row.remove(); updateTotal(); });
        timers.push(t); list.appendChild(row);
      }
      b.querySelector("#tw-add").addEventListener("click", addTimer); addTimer();
      return function cleanup() { timers.forEach(function (t) { clearInterval(t.iv); }); };
    }
  });

  app({
    id: "pointkeeper", title: "pointkeeper", cat: "Games",
    desc: "A simple multi-player score keeper that remembers between visits.",
    render: function (b) {
      b.innerHTML =
        '<p class="app-lede">Track scores for any game. Saved in your browser.</p>' +
        '<div class="row"><div class="field"><label>Add player</label><input id="pk2-name" placeholder="Name"></div>' +
        '<div style="flex:0 0 auto;align-self:flex-end"><button class="btn" id="pk2-add">Add</button></div></div>' +
        '<div class="cards-mini" id="pk2-list"></div>' +
        '<div class="btn-row"><button class="btn danger" id="pk2-reset">Reset all</button></div>';
      var name = b.querySelector("#pk2-name"), list = b.querySelector("#pk2-list");
      function load() { try { return JSON.parse(localStorage.getItem("pk_players") || "[]"); } catch (e) { return []; } }
      function save(p) { localStorage.setItem("pk_players", JSON.stringify(p)); }
      var players = load();
      function draw() {
        list.innerHTML = players.length ? players.map(function (p, i) {
          return '<div class="mini"><h4>' + esc(p.name) + '</h4><div class="result" style="font-size:1.5rem">' + p.score + '</div>' +
            '<div class="btn-row"><button class="btn plain" data-d="-1" data-i="' + i + '">\u2212</button>' +
            '<button class="btn plain" data-d="1" data-i="' + i + '">+</button>' +
            '<button class="btn danger plain" data-rm="' + i + '">\u2715</button></div></div>';
        }).join("") : '<p class="note">No players yet. Add one above.</p>';
        list.querySelectorAll("[data-d]").forEach(function (btn) { btn.addEventListener("click", function () { players[+btn.dataset.i].score += +btn.dataset.d; save(players); draw(); }); });
        list.querySelectorAll("[data-rm]").forEach(function (btn) { btn.addEventListener("click", function () { players.splice(+btn.dataset.rm, 1); save(players); draw(); }); });
      }
      function add() { if (!name.value.trim()) return; players.push({ name: name.value.trim(), score: 0 }); name.value = ""; save(players); draw(); }

      name.addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
      b.querySelector("#pk2-reset").addEventListener("click", function () { players = []; save(players); draw(); });
      draw();
    }
  });

            "\u2022 Masochistic: -2 constitution.\n" +
            "\u2022 Irrational: -2 intelligence.\n\n" +
            "VIRTUES\n" +
            "\u2022 Stalwart: +2 armor.\n" +
            "\u2022 Courageous: +2 constitution.\n" +
            "\u2022 Focused: +2 dexterity.\n" +
            "\u2022 Powerful: +2 strength.\n" +
            "\u2022 Vigorous: +10 max health.",
          areas: [
            { name: "South Wall Market", desc: "Entered through the path in Sector 6. Home to the Inn, Item Store, Diner, Pharmacy, Boutique, and Materia Store. A screen is located halfway along the left end." },
            { name: "North Wall Market", desc: "A little smaller than the south. Home to the Bar, Weapon Store, and the Men's Hall gym, with more piles of scrap along the tents left over from the Weapon Store owner." },
            { name: "[SOUTH] Inn", desc: "Directly at the entrance to Wall Market; costs 10 gil to stay. Its vending machine sells items for 200, 100, or 50 gil after speaking with the Materia Store owner \u2014 the most expensive item gives the best reward." },
            { name: "[SOUTH] Item Store", desc: "The shop labeled \"Item\" has no human clerk and no purchasable goods. At the end is a computer terminal, guarded by a machine gun turret above." },
            { name: "[SOUTH] Diner", desc: "A standard American-style diner selling food for 70 gil (Korean B.B.Q. Plate, Sushi Plate, or Today's Special). Answering favorably about the food rewards a Pharmacy Coupon used for Cloud's disguise." },
            { name: "[SOUTH] Pharmacy", desc: "A small one-room store with shelves of medicine. Restorative items can be purchased, and a Pharmacy Coupon trades for a Deodorant, Disinfectant, or Digestive \u2014 the Digestive being best for Cloud's disguise." },
            { name: "[SOUTH] Boutique", desc: "A clothing store that makes custom dresses. Cloud obtains a custom dress after fetching the owner from a bar: a Cotton, Satin, or Silk Dress \u2014 the Silk Dress (\"feels soft\" and \"shimmers\") scores most in the disguise quest." },
            { name: "[SOUTH] Materia", desc: "A well-decorated store that initially sells no Materia. The merchant hires the player to buy an item from the inn's vending machine, rewarding a Glass, Ruby, or Diamond Tiara (Diamond is best). After the Sector 7 incident, it stocks basic Materia for sale." },
            { name: "[SOUTH] Honey Bee Inn", desc: "A members-only adult club, brightly lit with neon. Cloud enters with a membership card and, depending on the room chosen, obtains either Bikini briefs or Lingerie for the disguise, plus make-up in the dressing room." },
            { name: "[NORTH] Bar", desc: "A wider room with a kitchen, stalls, a screen, and a karaoke booth. Helping a sick patron rewards a Cologne, Flower Cologne, or Sexy Cologne (best, given for a Digestive)." },
            { name: "[NORTH] Weapon Store", desc: "Near piles of scrap, advertised by a neon \"Machine Gun\" sign. Two rooms behind metal fences: a counter with guns and ammo on display, and an office with posters, a computer, and the owner's tank." },
            { name: "[NORTH] Men's Hall", desc: "A boxing gym that also serves as a gathering point for cross-dressers, led by \"Beautiful Bro\". Cloud visits to obtain a wig for his disguise." },
            { name: "[NORTH] Corneo Hall", desc: "Corneo's mansion at the north end. The entrance is guarded by a bouncer who only lets women enter \u2014 prompting Aerith's idea to disguise Cloud. After the Sector 7 incident the mansion is abandoned." },
            { name: "[NORTH] Corneo Hall Lobby", desc: "Headquarters of the crime lord Don Corneo, full of debauchery and a grand oriental aesthetic in red and gold. Beneath Corneo's chambers lurks the monster Aps in the sewers. The lobby's stairs lead to the Office, the Lackey Room, and the Torture Room." },
            { name: "[NORTH] Corneo Hall Office", desc: "Where Corneo chooses his \"bride\". Statues line the entrance, a long red carpet leads to his desk, and a door at the back leads to his bedroom. The party is taken here after rendezvousing with Tifa in the Torture Room." }
          ],

        {
          name: "World on Fire",
          desc: "Avatar: The Last Airbender \u2014 what if Firelord Ozai had defeated Aang during the harmonic convergence? 500 years later, a corrupt imperial Fire Nation controls all ways of life, and it is up to the people to decide their fate against impossible odds.",
          backstory:
            "THEMES\n" +
            "\u2022 Imperialism \u2014 Zuko Alone (Book 2, E07)\n" +
            "\u2022 Corruption in Government \u2014 Lake Laogai (Book 2, E17) & The Earth King (Book 2, E18)\n" +
            "\u2022 Class Struggles \u2014 City of Walls and Secrets (Book 2, E14)\n" +
            "\u2022 Genocide \u2014 The Southern Air Temple (Book 1, E03)\n" +
            "\u2022 The Environment \u2014 Winter Solstice (Book 1, E07) & The Painted Lady (Book 3, E03)\n" +
            "\u2022 Propaganda \u2014 The Headband (Book 3, E02)\n\n" +
            "ELEMENTS\n" +
            "\u2022 Water \u2014 calm, healing, traditional, moon.\n" +
            "\u2022 Earth \u2014 lawful, disciplined, fragmented, natural wonders.\n" +
            "\u2022 Fire \u2014 militarized, aggressive, ruthless, sun.\n" +
            "\u2022 Air \u2014 peaceful, pacifist, nomads, openness.\n\n" +
            "OPENING SEQUENCE\n" +
            "It has been 500 years since Aang and Ozai fought, but the consequences still resonate. The sky is painted with dark clouds, lit a reddish-black hue. Fire Nation history has been rewritten or burned; few know the horrors of the past, and any mention of past events is considered illegal.\n\n" +
            "After conquering the world, the Fire Nation imprisoned elite Earth and Water benders and killed the rest. With Aang and the air temples destroyed, airbending was snuffed out. Bending is forbidden except by Fire Nation military or enslaved benders (Earth for city-building, Water for medics). Technology advanced into an industrial/steampunk age, and ruthless military squads called Embers enforce the law, sometimes with tanks or cannons.\n\n" +
            "In this police state, all business profit is forfeited monthly to the Fire Nation, then a discretionary stipend is returned \u2014 just enough to stay afloat. Living outside Fire Nation society means dealing with rage-filled spirits that roam the land.\n\n" +
            "We open in Smolder, a former Earth Kingdom city (Boulder) now the largest producer of steel plates, piping, and industrial components, worked endlessly by enslaved metal-benders under Ember supervision. It is a late spring morning on collections day, and more Ember squads than usual arrive \u2014 rumor says the Phoenix King has ordered production increased by any means.\n\n" +
            "SPECIAL EVENTS / RULES\n\n" +
            "Weather Patterns \u2014 1d10: evens = normal day; 1/3/5 = rain; 7 = solar flare; 9 = windy.\n\n" +
            "Global Strategy \u2014 Controlling a major city lets the group prepare a military play using any resources to take other parts of the world.\n\n" +
            "War of Spirits \u2014 While campaigning, there's a chance to find 10 good spirits fighting 10 bad spirits. Saved good spirits drop a coin of their slogan that, when used, calls upon them to perform it.\n\n" +
            "Improvised Combat \u2014 Benders can bend up to their weight in their element (double or more in great need, at a cost to safety). Damage is normally 1d10, scaling up or down with the scenario.\n\n" +
            "Radiation Poisoning \u2014 CONST of 12+ periodically. Gon's healing lowers the counter one per short rest. Failed checks: 1) hot; 2) dizzy (DEX 10+ to not trip); 3) nauseous (CONST 15+ to not vomit); 4) weak (disadvantage on physical checks); 5) max health reduced 1d10 (min 1); 6) unconscious.\n\n" +
            "Civil Unrest \u2014 PERCEPTION 12+ periodically, 1d4 result: 1) Ember squad with ~10 detained civilians; 2) a couple talking to an Ember scribe pointing at you; 3) Boomey's employee fighting an Ember squad; 4) youths vandalizing stores.\n\n" +
            "Heated Springs Raid \u2014 The Fire Nation orders the Heated Springs tribe dismantled; war balloons rain fire. Each Fire Nation encounter raises the PK bar by 1; at 3, the Phoenix King arrives.\n\n" +
            "Heated Springs Liberation \u2014 If the Fire Nation is defeated, decide the fate of up to 50 remaining tribe members; you may deploy that many by messenger bird.\n\n" +
            "PK Arrival \u2014 Sky turns dark red, a giant phoenix of fire melts large portions of ice, and reincarnates from an egg after a few hours if somehow defeated.",
          areas: [
            { name: "World Map", desc: "World map of Earth." },
            { name: "EARTH: Smolder", desc: "Largest population and producer of industrial materials \u2014 steel plates, cabling, piping. Key settlement for technological advancement." },
            { name: "EARTH: Igni", desc: "Covered by mountains and volcanos, making it one of the most life-threatening landscapes in the world." },
            { name: "EARTH: Thunderbluff", desc: "Home to the discovery of lightning bending, which drove huge progress in innovation \u2014 namely torture devices." },
            { name: "EARTH: Burning Vitality", desc: "Lush forests of vibrant foliage and fauna. Visible scars of past wars remain, but the land is relatively healthy. Travelers stay alert here." },
            { name: "FIRE: Searing Pig", desc: "Mainly known for food production. Gritty and borderline savage, largely populated by nationalists and Fire Nation sympathizers." },
            { name: "FIRE: Torchlight Vault", desc: "Rumored to record and store history. Difficult to find and harder to enter. Ember scribes have been known to peruse its collection." },
            { name: "FIRE: Firestorm Palace", desc: "The capital of the world. Only the rich and powerful live here, including the rumored Phoenix King. Distributes currency, develops laws, and trains the military." },
            { name: "WATER: Frostfire", desc: "Named after the lands of the Heated Springs. Healing geysers erupt across the land, giving rise to a specialized healing waterbending." },
            { name: "WATER: Heated Springs", desc: "Named after the lands of the Frostfire. Vast, thick ice has resisted Fire Nation melting. Elite firebenders train here to push their limits." },
            { name: "AIR: Ruins of Air", desc: "Remains of a once peaceful civilization." }
          ],
          characters: [
            ch("Shina", "Level 5 \u00b7 True Neutral \u00b7 Human Lava Bender",
              "A living legacy of Kyoshi, the last known Earth Kingdom avatar. An outcast teaching herself the rare, dangerous art of lava-bending. Exiled by her family for being a rebel, she was raised by friendly badger moles in a cave. After evil spirits drove her to a volcano's edge, a vision of Kyoshi and a fury of molten rock saved her \u2014 and she swore to take back these lands. She lives in that same volcano near Smolder.",
              st(20, 13, 10, "15 (+2)", "8 (-1)", "15 (+2)", "8 (-1)", "15 (+2)", "8 (-1)"),
              ["Molten Rock Armor (Combat/RP, 1 action, no cooldown): +2 AC to a friendly target (includes self).",
               "Seismic Sense (Combat/RP, 1 action, short rest cooldown): Touch the ground to sense everything within a 1 mile radius, granting advantage on tracking-related perception rolls.",
               "Lava Wave (Combat, 1 action, long rest cooldown): Hurl a wall of lava at a target. DEX saving throw of 15+ to resist; if struck, 5d20 damage."]),
            ch("Michigan Galactus", "Level 5 \u00b7 Neutral Good \u00b7 Human Air Bender",
              "A former Fire Nation Ember scribe who defected after the forbidden section of the Torchlight Vault confirmed his doubts. There he found the \"Mystic Arts of Ether\" \u2014 a book of airbending \u2014 and slipped away unnoticed. A nomad and tinkerer, he integrates airbending into crafted gadgets. He's in Smolder seeking the latest tech.",
              st(5, 10, 10, "8 (-1)", "15 (+2)", "8 (-1)", "15 (+2)", "8 (-1)", "15 (+2)"),
              ["Gust (Combat/RP, 1 action, 1 round cooldown): Release a gust pushing targets 1d10 feet away (DEX/STR save of 12+). Each round active adds another 1d10 feet and +1 to the save.",
               "Air Scooter (Combat/RP, 1 bonus action, 1 round cooldown): Ride a ball of air; you don't touch the ground and base speed doubles. If hit, the ball dissipates (DEX save of 13+ to land properly).",
               "Steady Breathing (Combat/RP, 1 action, short rest cooldown): Meditate to double the effectiveness of your next airbend within an hour. Out of combat only."]),
            ch("Athari", "Level 5 \u00b7 Human Fire Bender",
              "A member of the elite Ember squad as a Weaver, specialized in extortion and torture. Unlike most, he seeks middle ground between civilians and the military \u2014 likely due to his mixed-nation upbringing (Fire Nation father, Water Tribe mother). Stationed in Smolder, awaiting his next order from the Pyroguard Council.",
              st(20, 14, 10, "8 (-1)", "15 (+2)", "8 (-1)", "15 (+2)", "15 (+2)", "8 (-1)"),
              ["Scorched Earth (Combat/RP, 1 action, 1 round cooldown): Burn the ground around a target for 1d10/round. DEX save of 13+ for half damage.",
               "Dragon Stance (Combat/RP, 1 bonus action, 2 round cooldown): Toggle stance; in Dragon Stance, attack physically up to 3 times per round but cannot firebend.",
               "Immolation (Combat/RP, 1 action, short rest cooldown): Erupt into flame, dealing 1d20 to all within 10 feet while you take 1d10. Not while raining or windy."]),
            ch("Gon", "Level 5 \u00b7 Human Water Bender",
              "One of many waterbenders from Heated Springs \"commissioned\" by the Fire Nation to heal their military. He secretly recovered a blood-soaked booklet outlining blood bending from a captured old woman, keeping it hidden even from his family. Now an enslaved waterbender in Smolder, he protects and heals Ember squads.",
              st(10, 8, 10, "8 (-1)", "8 (-1)", "15 (+2)", "15 (+2)", "15 (+2)", "8 (-1)"),
              ["Healing Touch (Combat/RP, 1 action, no cooldown): Flow water into a wound to heal a target 1d10.",
               "Drown (Combat/RP, 1 action, 1 round cooldown): Bend water around a target's head, cutting off oxygen. STR/DEX save of 13+ to resist; each round drowning deals 1d10 \u00d7 rounds drowning.",
               "Forbidden Blood Bending (Combat/RP, 2 actions, long rest cooldown): Bend a target's body to your will. Expressly forbidden \u2014 nearby NPCs turn hostile or cower in fear."]),
            ch("Boomey", "Level 5 \u00b7 Neutral Good \u00b7 Human Earth Bender",
              "CEO of Cabbage Corp out of Smolder. He took over his father's cabbage business at 13, days after an Ember Trooper killed his father on a collections day. His family broke apart in the aftermath. Standing up to Fire Nation injustices has landed him in many fights. A prime example of former Earth Kingdom unyielding spirit \u2014 this beaten dog still has teeth.",
              st(20, 10, 10, "15 (+2)", "8 (-1)", "15 (+2)", "15 (+2)", "8 (-1)", "8 (-1)"),
              ["Inner Focus (Combat/RP, 1 action, short rest cooldown): Hone in on one target; all accuracy against them is doubled (roll at advantage).",
               "Repressed Anger (Combat/RP, passive, no cooldown): Against Ember squads/Fire Nation, bending damage is doubled (2d10) but rolls to hit are at disadvantage.",
               "Mental Fortitude (Combat/RP, passive, short rest cooldown): Reroll the next INT/WIS saving throw, taking the higher die."]),
            ch("Ember Trooper", "Fire Nation military",
              "Heavily armored military infantry trained to enforce Fire Nation laws without accountability. Their formidable steel armor masks their identity, distancing them from humanity.",
              st(100, 10, 10, "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)"), []),
            ch("Ember Weaver", "Fire Nation military",
              "Lightly armored firebending specialists trained in extortion and torture. Their armor bears strange markings to instill fear and confusion.",
              st(100, 10, 10, "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)"), []),
            ch("Ember Scribe", "Fire Nation military",
              "Lightly armored non-bender knowledgeable on Fire Nation law. Their royal, diplomatic armor projects a lawful image. Scribes lead patrols to collect taxes, dispatch squads, and interrogate locals for rumors of subversion.",
              st(100, 10, 10, "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)"), []),
            ch("Enslaved Bender", "Fire Nation captive",
              "Beaten and taken to the brink, enslaved benders are the only non-fire benders pre-approved to bend other elements. Descendants of elite benders, taught early to obey \u2014 rebels are killed, the disobedient beaten, the compliant live relatively normal lives. Most wear a lightning-charged shock collar bent by Ember weavers.",
              st(100, 10, 10, "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)"), []),
            ch("Pyroguard Council", "Fire Nation command",
              "Responsible for prioritizing and dispatching Ember squads to cities, plus their logistics \u2014 housing, heavy machinery, and travel.",
              st(100, 10, 10, "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)"), []),
            ch("Infernal Dynasty", "Fire Nation elite",
              "Trusted advisors of the Phoenix King.",
              st(100, 10, 10, "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)"), []),
            ch("Phoenix King", "Fire Nation supreme leader",
              "Supreme leader of the Fire Nation and, by extension, the world. Never seen outside the Infernal Dynasty, whispers throughout the land question his actual existence.",
              st(100, 10, 10, "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)", "10 (+0)"), [])
          ],
          items: []

        {
          name: "Pitch Black",
          desc: "Ruin has come to this land and you are the only ones who can save it.",
          backstory:
            "A perilous descent into madness, dealing with a prodigious number of threats to body and mind. Five hundred feet below the earth you will fight not only unimaginable foes, but famine, disease, and the stress of the ever-encroaching dark. Driven by a set of 9 predefined classes chosen by players.\n\n" +
            "SETTING\n" +
            "A dark gothic atmosphere. Corruption and monsters have overrun the once-idyllic estate of the players' late ancestor. The impoverished Hamlet must now withstand unthinkable nightmares. The ancestor himself caused this evil, meddling with dark forces in pursuit of immortality and unsealing a nightmarish power entombed below his mansion. Repentant, he ended his own life and bequeathed the Estate to you, urging that you purge it.\n\n" +
            "SPECIAL RULES\n\n" +
            "Stress Meter \u2014 In addition to health and mana, each character has a stress meter. Horrific events, stress abilities, or critical hits deal stress damage. At the stress threshold, characters suffer a class-based negative attribute (see each character's Personality/Psyche).\n\n" +
            "Light Meter \u2014 While exploring the Ruins, Warrens, Weald, or Cove, torchlight diminishes and darkness takes over. Every turn in darkness (10 seconds) inflicts 10 stress damage.\n\n" +
            "Hunger \u2014 At certain intervals, hunger checks are announced (cannot be skipped). With food, take the action to eat and regain 10 health. Without food, take 20% of max health as damage and 10 stress damage.",
          areas: [
            { name: "Hamlet", desc: "A quiet, decayed settlement on the Estate's grounds where a handful of people cling to a squalid yet relatively civilized existence." },

        {
          name: "Universal Collision",
          desc: "Assume the role of a famous character or couple in an on-the-fly adventure.",
          backstory:
            "This story is played out completely ad-hoc since it is highly dependent on the player characters.\n\n" +
            "UNIVERSAL COLLISION\n\n" +
            "Personality Quiz Character Creation \u2014 The gimmick of this one-shot is that you must choose an individual character from the OpenPsychometrics character quiz (openpsychometrics.org/tests/characters). To join as a couple, use the couples quiz (openpsychometrics.org/tests/characters/couples).",
          areas: [],
          characters: [],
          items: []
        }
      ];

      function statBlock(s) {
        if (!s) return "";
        var rows = [];
        Object.keys(s).forEach(function (k) {
          var v = s[k];
          if (v === "" || v == null) return;
          rows.push('<div class="ind"><div class="k">' + esc(k) + '</div><div class="v">' + esc(String(v)) + "</div></div>");
        });
        return rows.length ? '<div class="indicators" style="margin:.5rem 0">' + rows.join("") + "</div>" : "";
      }
      function card(inner) { return '<div style="border:1px solid var(--rule);border-radius:4px;padding:.7rem;margin:.5rem 0">' + inner + "</div>"; }
      function para(t) { return '<p style="white-space:pre-wrap;margin:.3rem 0">' + esc(t) + "</p>"; }

      b.innerHTML =
        '<p class="app-lede">Pick a tabletop adventure, then browse its story, areas, characters, and items.</p>' +
        '<div class="field"><label>Adventure</label><select id="os-pick">' +
        adventures.map(function (a, i) { return '<option value="' + i + '">' + esc(a.name) + "</option>"; }).join("") +
        '</select></div>' +
        '<div class="tabs" id="os-tabs"></div>' +
        '<div id="os-panel"></div>';
      var pick = b.querySelector("#os-pick"), tabsEl = b.querySelector("#os-tabs"), panel = b.querySelector("#os-panel");
      var cur = 0, tab = "story";

      function tabsFor(a) {
        var t = [["story", "Story"]];
        if (a.areas && a.areas.length) t.push(["areas", "Areas"]);
        if (a.characters && a.characters.length) t.push(["characters", "Characters"]);
        if (a.items && a.items.length) t.push(["items", "Items"]);
        return t;
      }
      function renderPanel() {
        var a = adventures[cur];
        if (tab === "areas") {
          panel.innerHTML = a.areas.map(function (x) { return card('<h4 style="margin:.1rem 0">' + esc(x.name) + "</h4>" + (x.desc ? para(x.desc) : "")); }).join("");
        } else if (tab === "characters") {
          panel.innerHTML = a.characters.map(function (c) {
            return card('<h4 style="margin:.1rem 0">' + esc(c.name) + "</h4>" +
              (c.sub ? '<div class="note" style="margin:.1rem 0">' + esc(c.sub) + "</div>" : "") +
              (c.desc ? para(c.desc) : "") + statBlock(c.stats) +
              (c.abilities && c.abilities.length ? "<ul>" + c.abilities.map(function (ab) { return '<li style="white-space:pre-wrap;margin:.2rem 0">' + esc(ab) + "</li>"; }).join("") + "</ul>" : ""));
          }).join("");
        } else if (tab === "items") {
          panel.innerHTML = a.items.map(function (i) {
            return card('<h4 style="margin:.1rem 0">' + esc(i.name) + (i.cost ? ' <span class="note">(' + esc(i.cost) + " gil)</span>" : "") + "</h4>" + (i.desc ? para(i.desc) : ""));
          }).join("");
        } else {
          panel.innerHTML = '<p class="app-lede" style="margin-top:0">' + esc(a.desc) + "</p>" + para(a.backstory);
        }
      }
      function renderTabs() {
        var a = adventures[cur], t = tabsFor(a);
        if (!t.some(function (x) { return x[0] === tab; })) tab = "story";
        tabsEl.innerHTML = t.map(function (x) { return '<button class="btn" data-t="' + x[0] + '"' + (x[0] === tab ? ' aria-pressed="true"' : "") + ">" + x[1] + "</button>"; }).join("");
        tabsEl.querySelectorAll("[data-t]").forEach(function (btn) {
          btn.addEventListener("click", function () { tab = btn.getAttribute("data-t"); renderTabs(); renderPanel(); });
        });
      }
      pick.addEventListener("change", function () { cur = Number(pick.value); tab = "story"; renderTabs(); renderPanel(); });
      renderTabs(); renderPanel();
    }
  });

        '<div class="swatch" id="st-stage"></div>' +
        '<div class="row"><div class="field"><label>Speed (ms)</label><input type="range" min="50" max="1000" step="50" value="300" id="st-speed"></div></div>' +
        '<div class="btn-row"><button class="btn" id="st-toggle">Start strobe</button></div>';
      var stage = b.querySelector("#st-stage"), speed = b.querySelector("#st-speed"), toggle = b.querySelector("#st-toggle");
      var iv = null;
      function rand() { return "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0"); }
      function start() { stop(); iv = setInterval(function () { stage.style.background = rand(); }, Number(speed.value)); toggle.textContent = "Stop strobe"; }
      function stop() { if (iv) { clearInterval(iv); iv = null; } toggle.textContent = "Start strobe"; }
      toggle.addEventListener("click", function () { iv ? stop() : start(); });
      speed.addEventListener("input", function () { if (iv) start(); });
      return function cleanup() { stop(); };
    }
  });

  /* ---- Maps: Explore the Rails ---- */
  app({
    id: "explorerails", title: "explorerails", cat: "Tools",
    desc: "Map of opportunities and points of interest near NJTransit train stops.",
    render: function (b) {
      b.innerHTML =
        '<p class="app-lede">See what opportunities are at NJTransit train stops.</p>' +
        '<iframe src="https://www.google.com/maps/d/embed?mid=1Zkw1Fsu3nPigqZwWKh0dBe4Wf7f6G3wU" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="NJTransit opportunities map"></iframe>' +
        '<p class="note">For reference: <a href="https://www.njtransit.com/pdf/rail/Rail_System_Map.pdf" target="_blank" rel="noopener">NJTransit System Map (PDF)</a></p>';
    }
  });

  /* ============================ render gallery ============================ */
  var grid = document.getElementById("grid");
  var filtersEl = document.getElementById("filters");
  var countEl = document.getElementById("count");
  var modal = document.getElementById("appModal");
  var appTitle = document.getElementById("appTitle");
  var appBody = document.getElementById("appBody");
  var currentCleanup = null;

  // sort + build cards
  apps.sort(function (a, z) { return a.title.localeCompare(z.title); });
  apps.forEach(function (a) {
    var card = h('<button class="card" data-id="' + a.id + '" data-cat="' + a.cat + '">' +
      '<span class="cat">' + a.cat + '</span><h3>' + esc(a.title) + '</h3><p class="desc">' + esc(a.desc) + "</p></button>");
    card.addEventListener("click", function () { openApp(a.id); });
    grid.appendChild(card);
  });

  // filter chips
  var cats = ["All"].concat(apps.map(function (a) { return a.cat; }).filter(function (v, i, s) { return s.indexOf(v) === i; }).sort());
  var active = "All";
  cats.forEach(function (c) {
    var chip = h('<button class="chip" aria-pressed="' + (c === "All") + '">' + c + "</button>");
    chip.addEventListener("click", function () {
      active = c;
      filtersEl.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", x.textContent === c); });
      applyFilter();
    });
    filtersEl.appendChild(chip);
  });
  function applyFilter() {
    var shown = 0;
    grid.querySelectorAll(".card").forEach(function (card) {
      var ok = active === "All" || card.getAttribute("data-cat") === active;
      card.classList.toggle("is-hidden", !ok); if (ok) shown++;
    });
    countEl.textContent = "// " + shown + " snippet" + (shown === 1 ? "" : "s");
  }
  applyFilter();

  /* ============================ modal engine ============================ */
  function openApp(id) {
    var a = apps.find(function (x) { return x.id === id; });
    if (!a) return;
    if (currentCleanup) { try { currentCleanup(); } catch (e) {} currentCleanup = null; }
    appTitle.textContent = a.title;
    appBody.innerHTML = "";
    appBody.scrollTop = 0;
    currentCleanup = a.render(appBody) || null;
    if (!modal.open) modal.showModal();
    if (history.replaceState) history.replaceState(null, "", "#" + id);
  }
  function closeApp() {
    if (currentCleanup) { try { currentCleanup(); } catch (e) {} currentCleanup = null; }
    appBody.innerHTML = "";
    if (modal.open) modal.close();
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
  }
  document.getElementById("appClose").addEventListener("click", closeApp);
  modal.addEventListener("close", function () {
    if (currentCleanup) { try { currentCleanup(); } catch (e) {} currentCleanup = null; }
    appBody.innerHTML = "";
  });
  modal.addEventListener("click", function (e) {
    var r = modal.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeApp();
  });

  // deep-link support (#snippetid auto-opens)
  function openFromHash() {
    var id = location.hash.replace(/^#/, "");
    if (id && apps.some(function (a) { return a.id === id; })) openApp(id);
  }
  window.addEventListener("hashchange", openFromHash);
  openFromHash();
  </script>
</body>
</html>
